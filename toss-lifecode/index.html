<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>8CODE 수비학 Lite</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090a10;
      }
      #lite-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        box-sizing: border-box;
      }
      #toss-banner-host {
        display: none;
        flex-shrink: 0;
        width: 100%;
        min-height: 0;
        box-sizing: border-box;
        padding: 8px 16px 4px;
        background: #090a10;
      }
      #toss-banner-host.is-active {
        display: block;
        min-height: 96px;
      }
      #lite-frame {
        flex: 1;
        display: block;
        width: 100%;
        min-height: 0;
        border: 0;
        background: #090a10;
      }
      .site-cta-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
        background: rgba(9, 10, 16, 0.96);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .site-cta-fab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: transparent;
        color: rgba(248, 246, 239, 0.72);
        font: 500 12px/1.2 "Noto Sans KR", system-ui, sans-serif;
        text-decoration: none;
      }
      .site-cta-fab:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="lite-shell">
      <div id="toss-banner-host" aria-label="광고"></div>
      <iframe id="lite-frame" title="8CODE 수비학 Lite"></iframe>
      <div class="site-cta-bar">
        <a
          class="site-cta-fab"
          id="siteCta"
          href="https://8code.kr/?utm_source=toss&utm_medium=app&utm_campaign=lifecode_lite"
          target="_blank"
          rel="noopener"
        >
          8CODE 사이트 →
        </a>
      </div>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
