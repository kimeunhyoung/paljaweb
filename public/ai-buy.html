<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>AI 해석 1회 체험 — 팔자연구소</title>
  <meta name="description" content="점성학 AI 차트 해석·운세 체험. 1회 1,000원부터. 마음에 들면 월 구독으로 이어가세요.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <style>
    :root {
      --cream: #f7f1e8;
      --ink: #2c2416;
      --muted: #8a7a68;
      --deep: #4a3520;
      --accent: #c8a96e;
      --border: rgba(139, 111, 71, 0.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 64px; }
    .back { color: var(--muted); text-decoration: none; font-size: 14px; }
    h1 { font-size: 1.55rem; color: var(--deep); margin: 14px 0 8px; }
    .lede { color: var(--muted); font-size: 0.95rem; margin: 0 0 20px; }
    .product {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .product.is-selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(200,169,110,.35); }
    .product-title { font-weight: 700; color: var(--deep); margin-bottom: 4px; }
    .product-price { font-size: 1.2rem; font-weight: 700; color: var(--deep); }
    .product-price span { font-size: 0.85rem; font-weight: 500; color: var(--muted); margin-left: 6px; }
    .product-desc { font-size: 0.88rem; color: var(--muted); margin-top: 8px; }
    .auth-gate, .auth-ok, .msg, .success {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin: 14px 0;
      font-size: 0.92rem;
    }
    .auth-gate.is-visible, .auth-ok.is-visible, .msg.is-visible, .success.is-visible { display: block; }
    .auth-gate { background: #fff7ed; border: 1px solid #fdba74; }
    .auth-ok { background: #ecfdf5; border: 1px solid #6ee7b7; }
    .msg.err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .msg.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .success { background: #fff; border: 1px solid var(--border); }
    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--deep);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .fine { font-size: 12px; color: var(--muted); margin-top: 12px; }
    .fine a { color: var(--deep); }
    .links { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
    .links a { color: var(--deep); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/astrology.html">← 점성학</a>
    <h1>AI 해석 1회 체험</h1>
    <p class="lede">구독 전에 AI 차트·운세를 한 번 써 보세요. 크레딧은 로그인 계정에 바로 들어갑니다.</p>

    <div id="shop">
      <div class="auth-gate" id="authGate">
        <p><strong>로그인이 필요합니다.</strong> 결제 크레딧을 계정에 넣어 드려요.</p>
        <div class="links">
          <a id="authSignupLink" href="/signup.html">무료 가입</a>
          <a id="authLoginLink" href="/login.html">로그인</a>
        </div>
      </div>
      <div class="auth-ok" id="authOk">로그인됨 — 결제 후 이 계정에 크레딧이 지급됩니다.</div>
      <div id="productList"></div>
      <div id="msg" class="msg" role="alert"></div>
      <button type="button" class="btn" id="payBtn" disabled>결제하기</button>
      <p class="fine">카드 1회 결제 · 자동 갱신 없음. 자주 쓰면 <a href="/pricing.html">Basic 월 9,900원(10크레딧)</a>이 더 이득입니다.</p>
    </div>

    <div class="success" id="successPanel">
      <strong>결제 완료</strong>
      <p id="successText" style="margin:8px 0 0;color:var(--muted)"></p>
      <div class="links">
        <a href="/astrology.html">점성학에서 AI 해석하기 →</a>
        <a href="/pricing.html">요금제 보기</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const productList = document.getElementById('productList');
    const payBtn = document.getElementById('payBtn');
    const msgEl = document.getElementById('msg');
    const shop = document.getElementById('shop');
    const successPanel = document.getElementById('successPanel');
    const authGate = document.getElementById('authGate');
    const authOk = document.getElementById('authOk');

    let products = [];
    let selectedKey = 'ai_chart';
    let cfg = null;
    let sessionUser = null;
    let accessToken = null;

    function buyNextUrl() {
      return 'ai-buy.html?product=' + encodeURIComponent(selectedKey || 'ai_chart');
    }

    function syncAuthLinks() {
      const next = encodeURIComponent(buyNextUrl());
      const signup = document.getElementById('authSignupLink');
      const login = document.getElementById('authLoginLink');
      if (signup) signup.href = '/signup.html?next=' + next;
      if (login) login.href = '/login.html?next=' + next;
    }

    function showMsg(text, kind) {
      msgEl.textContent = text;
      msgEl.className = 'msg is-visible ' + (kind || 'info');
    }
    function clearMsg() {
      msgEl.textContent = '';
      msgEl.className = 'msg';
    }

    function updateAuthUi() {
      syncAuthLinks();
      if (sessionUser) {
        authGate.classList.remove('is-visible');
        authOk.classList.add('is-visible');
        if (cfg && cfg.portoneConfigured && cfg.oneTimeEnabled !== false) payBtn.disabled = false;
      } else {
        authGate.classList.add('is-visible');
        authOk.classList.remove('is-visible');
        payBtn.disabled = true;
      }
    }

    function renderProducts() {
      productList.innerHTML = '';
      products.forEach((p) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'product' + (p.key === selectedKey ? ' is-selected' : '');
        btn.innerHTML =
          '<div class="product-title">' + p.title + '</div>' +
          '<div class="product-price">' + p.amount.toLocaleString('ko-KR') + '원' +
          '<span>AI ' + p.credits + '크레딧</span></div>' +
          '<div class="product-desc">' + p.desc + '</div>';
        btn.addEventListener('click', () => {
          selectedKey = p.key;
          renderProducts();
          syncAuthLinks();
        });
        productList.appendChild(btn);
      });
    }

    async function authHeaders() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return {};
      accessToken = session.access_token;
      return { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' };
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      sessionUser = session && session.user ? session.user : null;
      accessToken = session ? session.access_token : null;

      const res = await fetch('/api/ai-credits/checkout/config');
      cfg = await res.json().catch(() => ({}));
      products = cfg.products || [];
      const params = new URLSearchParams(location.search);
      const q = params.get('product');
      if (q && products.some((p) => p.key === q)) selectedKey = q;
      else if (products[0]) selectedKey = products[0].key;
      renderProducts();
      updateAuthUi();

      if (!cfg.portoneConfigured) {
        showMsg('결제 설정이 아직 준비되지 않았어요. 잠시 후 다시 시도해 주세요.', 'err');
        payBtn.disabled = true;
      } else if (cfg.oneTimeEnabled === false) {
        showMsg('AI 1회 결제는 현재 준비 중입니다. 요금제에서 월 구독을 이용해 주세요.', 'info');
        payBtn.disabled = true;
      }
    }

    payBtn.addEventListener('click', async () => {
      clearMsg();
      if (!sessionUser) {
        showMsg('로그인 후 결제할 수 있어요.', 'info');
        updateAuthUi();
        return;
      }
      if (typeof PortOne === 'undefined') {
        showMsg('결제 모듈을 불러오지 못했습니다.', 'err');
        return;
      }
      payBtn.disabled = true;
      try {
        const headers = await authHeaders();
        const prep = await fetch('/api/ai-credits/checkout/prepare', {
          method: 'POST',
          headers,
          body: JSON.stringify({ productKey: selectedKey, email: sessionUser.email || undefined }),
        });
        const prepJson = await prep.json().catch(() => ({}));
        if (!prep.ok) {
          if (prepJson.error === 'one_time_disabled') {
            showMsg('AI 1회 결제는 현재 준비 중입니다. 요금제에서 월 구독을 이용해 주세요.', 'info');
            return;
          }
          if (prep.status === 401) {
            showMsg('로그인이 만료됐어요. 다시 로그인해 주세요.', 'err');
            updateAuthUi();
            return;
          }
          showMsg(prepJson.error || '결제 준비에 실패했습니다.', 'err');
          payBtn.disabled = false;
          return;
        }

        const response = await PortOne.requestPayment({
          storeId: cfg.storeId,
          channelKey: cfg.channelKey,
          paymentId: prepJson.paymentId,
          orderName: prepJson.orderName,
          totalAmount: prepJson.amount,
          currency: 'CURRENCY_KRW',
          payMethod: 'CARD',
          customer: {
            email: sessionUser.email || undefined,
            fullName: '팔자연구소',
          },
        });

        if (response && response.code != null) {
          showMsg(response.message || '결제가 취소되었습니다.', 'err');
          payBtn.disabled = false;
          return;
        }

        showMsg('결제 확인 중…', 'info');
        const conf = await fetch('/api/ai-credits/checkout/confirm', {
          method: 'POST',
          headers: await authHeaders(),
          body: JSON.stringify({ paymentId: prepJson.paymentId }),
        });
        const confJson = await conf.json().catch(() => ({}));
        if (!conf.ok) {
          showMsg(confJson.error || '결제 확인에 실패했습니다. 문의해 주세요.', 'err');
          payBtn.disabled = false;
          return;
        }

        shop.style.display = 'none';
        successPanel.classList.add('is-visible');
        document.getElementById('successText').textContent =
          (confJson.title || 'AI 크레딧') + ' ' + (confJson.credits || '') +
          '크레딧이 계정에 지급되었습니다. 점성학 페이지에서 AI 해석을 눌러 보세요.';
      } catch (e) {
        console.error(e);
        showMsg('결제 중 오류가 발생했습니다.', 'err');
        payBtn.disabled = false;
      }
    });

    init();
  })();
  </script>
</body>
</html>
