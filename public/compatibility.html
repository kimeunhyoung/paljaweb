<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/site-topbar.js?v=5" defer></script>
<script src="js/topbar-session.js?v=6" defer></script>
<link rel="stylesheet" href="css/birth-date-picker.css">
<style>
:root {
  --cream: #f5f0e8;
  --parchment: #ede5d4;
  --void: #f5f0e8;
  --deep: #4a3520;
  --deep-brown: #4a3520;
  --surface: #ffffff;
  --surface2: #f5f0e8;
  --surface3: #ede5d4;
  --ink: #2c1f0e;
  --ink-dim: #9a8570;
  --ink-faint: #d4c4a8;
  --gold: #c8a96e;
  --gold-bright: #8b6f47;
  --gold-dim: #a08050;
  --rose: #b85555;
  --rose-dim: rgba(184,85,85,.12);
  --teal: #2e8b7a;
  --teal-dim: rgba(46,139,122,.12);
  --amber: #c88840;
  --border: rgba(139,111,71,.15);
  --border-active: rgba(200,169,110,.45);
  --accent: #c8a96e;
  --accent-lt: #e8d5b0;
  --muted: #9a8570;
  --shadow: rgba(44,31,14,.08);
  --font-serif: 'Noto Serif KR', serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-serif);
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ── Program shell (analysis·타로·네임코드와 동일 레이아웃) ── */
.site-top {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(245, 240, 232, 0.98);
  box-shadow: 0 6px 18px rgba(45, 38, 28, 0.06);
}
.topbar {
  min-height: 52px;
  background: rgba(245,240,232,.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(139,111,71,.15);
  display: flex;
  align-items: center;
  padding: 10px 32px;
  justify-content: space-between;
  gap: 16px;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 20px;
  min-width: 0;
  flex: 1 1 auto;
}
.topbar-logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 16px;
  font-weight: 700;
  color: #4a3520;
  text-decoration: none;
  letter-spacing: .01em;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}
.topbar-logo-mark {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: linear-gradient(160deg, #5a402d 0%, #3d2b1f 65%, #2d1f16 100%);
  color: #f5f0e8;
  font-family: 'DM Serif Display', 'Noto Serif KR', serif;
  font-size: 17px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(245,240,232,.22);
  position: relative;
  overflow: hidden;
}
.topbar-logo-mark::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,0) 46%);
  pointer-events: none;
}
.topbar-logo-mark::after {
  content: '八';
  position: absolute;
  right: 2px;
  top: 0;
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,.30);
  line-height: 1;
  pointer-events: none;
}
.topbar-sep { width: 1px; height: 16px; background: rgba(139,111,71,.15); }
.topbar-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  font-weight: 600;
  color: #4a3520;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
  flex-shrink: 0;
}
.plan-badge {
  font-family: 'Noto Serif KR', serif;
  font-size: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(139,111,71,.15);
  color: #9a8570;
  font-weight: 700;
}
.plan-badge.free {
  border-color: rgba(139, 111, 71, 0.35);
  color: #8b6f47;
  background: rgba(232, 213, 176, 0.35);
}
.plan-badge.basic {
  border-color: #c8a96e;
  color: #8b6f47;
  background: #e8d5b0;
}
.plan-badge.pro {
  border-color: #2e8b7a;
  color: #2e8b7a;
  background: rgba(46,139,122,.12);
}
.plan-badge.professional {
  border-color: #4a3520;
  color: #4a3520;
  background: #ede5d4;
}
.topbar-export-btns {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.counselor-bar-btn {
  font-family: 'Noto Serif KR', serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  color: #4a3520;
  background: #fff;
  border: 1px solid rgba(139,111,71,.15);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  transition: border-color .15s, background .15s, color .15s;
}
.counselor-bar-btn:hover {
  background: #ede5d4;
  border-color: #8b6f47;
  color: #2c1f0e;
}
.topbar-auth {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.topbar-auth-link {
  font-family: 'Noto Serif KR', serif;
  font-size: 12px;
  font-weight: 600;
  color: #9a8570;
  text-decoration: none;
  white-space: nowrap;
  transition: color .15s;
}
.topbar-auth-link:hover { color: #4a3520; }
.topbar-auth-dot { color: rgba(139,111,71,.25); font-weight: 400; user-select: none; font-size: 12px; }
.topbar-auth-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.topbar-auth-btn {
  background: none;
  border: none;
  cursor: pointer;
  font: inherit;
  padding: 0;
  margin: 0;
}
.back-btn {
  font-family: 'Noto Serif KR', serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
  color: #4a3520;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color .15s;
  white-space: nowrap;
}
.back-btn:hover { color: #2c1f0e; }
.program-nav {
  border-bottom: 1px solid rgba(139,111,71,.15);
  background: rgba(255, 255, 255, 0.55);
  padding: 0 32px;
}
.program-nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
  padding: 7px 0 9px;
  font-family: 'Noto Serif KR', serif;
  font-size: 12px;
}
.program-nav-inner a {
  color: #9a8570;
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: color .15s;
  white-space: nowrap;
}
.program-nav-inner a:hover { color: #4a3520; }
.program-nav-current {
  color: #4a3520;
  font-weight: 700;
  white-space: nowrap;
}

/* ── Background atmosphere (비활성 — 네임코드·점성학과 톤 통일) ── */
.bg-canvas { display: none; }

/* ── Hero (네임코드와 동일 톤) ── */
.hero {
  background: var(--deep-brown);
  padding: 48px 24px 44px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '緣';
  position: absolute;
  right: -10px;
  top: -30px;
  font-family: var(--font-serif);
  font-size: 260px;
  color: rgba(200,169,110,.05);
  line-height: 1;
  pointer-events: none;
}
.hero-inner {
  max-width: 900px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.hero-tag {
  font-size: 11px;
  letter-spacing: .14em;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
}
.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 300;
  color: var(--cream);
  line-height: 1.25;
  margin-bottom: 10px;
  text-align: center;
}
.hero-title em {
  font-style: italic;
  color: var(--accent);
}
.hero-desc {
  font-size: 13px;
  color: rgba(245,240,232,.58);
  line-height: 1.75;
  margin-bottom: 32px;
  text-align: center;
}
.hero-desc a {
  color: var(--accent);
  text-decoration: underline;
}

/* ── Layout ── */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding: 36px 24px 100px;
}

/* ── Input panel ── */
.input-panel {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0;
  align-items: start;
  margin-bottom: 28px;
}

.person-card {
  background: rgba(245,240,232,.06);
  border: 1px solid rgba(200,169,110,.22);
  border-radius: 14px;
  padding: 24px 20px 20px;
  transition: border-color 0.3s, box-shadow 0.3s;
  box-shadow: none;
}
.person-card:focus-within {
  border-color: rgba(200,169,110,.45);
  box-shadow: 0 0 0 1px rgba(200,169,110,.12);
}
.card-label {
  font-size: 11px;
  letter-spacing: .08em;
  color: rgba(200,169,110,.76);
  text-transform: uppercase;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-label::after { content:''; flex:1; height:1px; background: rgba(200,169,110,.18); }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  letter-spacing: .04em;
  color: rgba(200,169,110,.76);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  background: rgba(245,240,232,.08);
  border: 1px solid rgba(200,169,110,.22);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--cream);
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.3s, background 0.3s;
  -webkit-appearance: none;
  color-scheme: dark;
}
.field input::placeholder { color: rgba(245,240,232,.25); }
.field input:focus {
  border-color: var(--accent);
  background: rgba(200,169,110,.06);
}
.field-hint {
  font-size: 11px;
  color: rgba(245,240,232,.46);
  margin-top: 6px;
  letter-spacing: 0.2px;
  line-height: 1.5;
}
.opt-tag {
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(245,240,232,.45);
  border: 1px solid rgba(200,169,110,.22);
  border-radius: 20px;
  padding: 2px 7px;
  margin-left: 6px;
  vertical-align: middle;
}

.divider-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 16px 0;
  gap: 6px;
}
.divider-col .hex {
  font-family: var(--font-serif);
  font-size: 22px;
  color: var(--accent);
  opacity: 0.85;
  animation: pulse-rose 3s ease-in-out infinite;
}
@keyframes pulse-rose {
  0%,100% { opacity:0.4; transform:scale(1); }
  50% { opacity:0.8; transform:scale(1.1); }
}

/* ── CTA ── */
.cta-wrap { text-align:center; margin-bottom: 0; }
.error-text {
  font-size: 12px;
  color: #e8a0a0;
  letter-spacing: 0.2px;
  margin-bottom: 14px;
  min-height: 18px;
}
.cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 13px 32px;
  color: var(--deep-brown);
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.2s;
}
.cta-btn:hover { background: #d4b87a; transform: translateY(-1px); }
.cta-btn:active { transform: translateY(0); }
.cta-btn:disabled { opacity:0.5; pointer-events:none; }
.cta-icon { font-size:14px; opacity:0.75; }

/* ── Result ── */
#result { display:none; }
.result-enter {
  animation: fadeSlide 0.7s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes fadeSlide {
  from { opacity:0; transform:translateY(28px); }
  to { opacity:1; transform:translateY(0); }
}

/* Score section */
.score-section {
  text-align: center;
  padding: 48px 0 40px;
  position: relative;
}
.score-names {
  font-family: var(--font-serif);
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 600;
  color: var(--deep-brown);
  letter-spacing: 0;
  margin-bottom: 32px;
}
.score-names .amp {
  font-style: normal;
  color: var(--rose);
  margin: 0 12px;
  opacity: 0.75;
}

.score-ring-outer {
  position: relative;
  width: 180px;
  height: 180px;
  margin: 0 auto 24px;
}
.score-ring-outer svg { transform: rotate(-90deg); }
.score-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-num {
  font-family: var(--font-serif);
  font-size: 54px;
  font-weight: 600;
  color: var(--deep-brown);
  line-height: 1;
}
.score-unit { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
.score-title {
  font-family: var(--font-serif);
  font-style: normal;
  font-size: 22px;
  font-weight: 600;
  color: var(--gold-bright);
  margin-bottom: 6px;
}
.score-caption { font-size: 13px; color: var(--muted); letter-spacing: 0; }
.direction-scores {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.direction-card {
  background: var(--parchment);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
}
.direction-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1px;
  margin-bottom: 4px;
}
.direction-val {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  color: var(--deep-brown);
  line-height: 1;
}
.direction-why {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.why-chip {
  font-size: 11px;
  line-height: 1;
  border-radius: 999px;
  padding: 5px 8px;
  border: 1px solid transparent;
}
.why-chip.high {
  background: rgba(200,169,110,.14);
  color: var(--gold-bright);
  border-color: rgba(200,169,110,.35);
}
.why-chip.mid {
  background: var(--teal-dim);
  color: var(--teal);
  border-color: rgba(46,139,122,.28);
}
.why-chip.low {
  background: var(--rose-dim);
  color: var(--rose);
  border-color: rgba(184,85,85,.28);
}

/* Sub-scores */
.sub-scores {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 36px;
  flex-wrap: wrap;
}
.sub-score-item { text-align: center; }
.sub-score-item .sub-label {
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.sub-score-bar {
  width: 80px;
  height: 3px;
  background: rgba(44,31,14,.08);
  border-radius: 2px;
  overflow: hidden;
  margin: 0 auto 6px;
}
.sub-score-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 1.4s cubic-bezier(0.4,0,0.2,1) 0.3s;
}
.sub-score-val {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  color: var(--deep-brown);
}

/* ── Number cards grid ── */
.section-heading {
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--muted);
  text-transform: uppercase;
  text-align: center;
  margin: 44px 0 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--font-serif);
  font-weight: 600;
}
.section-heading::before,
.section-heading::after {
  content:'';
  flex:1;
  height:1px;
  background: linear-gradient(90deg, transparent, rgba(200,160,88,0.3));
}
.section-heading::after {
  background: linear-gradient(90deg, rgba(200,160,88,0.3), transparent);
}

.nums-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 40px;
}
.num-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 16px;
  transition: border-color 0.3s;
  box-shadow: 0 4px 16px var(--shadow);
}
.num-card:hover { border-color: var(--border-active); }
.num-card-label {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 12px;
}
.num-card-sub {
  color: var(--muted);
  font-size: 11px;
  margin-left: 6px;
  letter-spacing: 0.1px;
}
.num-pair-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.num-box { text-align:center; flex:1; }
.num-name { font-size: 12px; color: var(--muted); margin-bottom: 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.num-val {
  font-family: var(--font-serif);
  font-size: 38px;
  font-weight: 600;
  line-height: 1;
  color: var(--deep-brown);
}
.num-trait { font-size: 12px; color: var(--gold-bright); margin-top:4px; letter-spacing:0.1px; opacity:1; font-weight:500; }
.num-sep {
  font-family: var(--font-serif);
  font-size: 20px;
  color: var(--ink-faint);
  padding-bottom: 8px;
}
.num-match-badge {
  font-size: 10px;
  text-align: center;
  padding: 6px 10px;
  border-radius: 20px;
  letter-spacing: 1px;
}
.match-high { background: rgba(200,169,110,.12); color: var(--gold-bright); }
.match-mid  { background: var(--teal-dim); color: var(--teal); }
.match-low  { background: var(--rose-dim); color: var(--rose); }

/* ── Tab analysis ── */
.analysis-tabs {
  margin-bottom: 14px;
  display: flex;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 4px 16px var(--shadow);

<script>
async function saveHarmonyPDF() {
  const resultEl = document.getElementById('result');
  if (!resultEl || resultEl.style.display === 'none') {
    alert('먼저 궁합 분석을 실행해주세요.');
    return;
  }
  const btn = document.getElementById('pdfBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 생성 중...'; }
  try {
    const target = document.querySelector('.content');
    const canvas = await html2canvas(target, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#f5f0e8',
      logging: false,
      windowWidth: Math.max(document.documentElement.scrollWidth, target.scrollWidth),
      windowHeight: Math.max(document.documentElement.scrollHeight, target.scrollHeight)
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297, margin = 10;
    const imgW = pageW - margin * 2;
    const imgH = canvas.height * imgW / canvas.width;
    let y = 0;
    const pageContentH = pageH - margin * 2;
    while (y < imgH) {
      const sY = (y * canvas.width) / imgW;
      const sH = (pageContentH * canvas.width) / imgW;
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width;
      pageCanvas.height = Math.min(sH, canvas.height - sY);
      pageCanvas.getContext('2d').drawImage(
        canvas,
        0, sY, canvas.width, pageCanvas.height,
        0, 0, canvas.width, pageCanvas.height
      );
      if (y > 0) pdf.addPage();
      const hMm = pageCanvas.height * imgW / pageCanvas.width;
      pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, hMm);
      y += pageContentH;
    }
    pdf.save(`팔자연구소_소울하모니_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch (e) {
    console.error('PDF 생성 오류:', e);
    alert('PDF 생성 중 오류가 발생했습니다. 인쇄 기능을 이용해주세요.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⬇ PDF 저장'; }
  }
}

const VOWELS = new Set('AEIOU');

const HC = {'ㄱ':1,'ㄲ':1,'ㄴ':2,'ㄷ':3,'ㄸ':3,'ㄹ':4,'ㅁ':5,'ㅂ':6,'ㅃ':6,'ㅅ':7,'ㅆ':7,'ㅇ':8,'ㅈ':9,'ㅉ':9,'ㅊ':1,'ㅋ':2,'ㅌ':3,'ㅍ':4,'ㅎ':5};
const HV = {'ㅏ':1,'ㅑ':2,'ㅓ':3,'ㅕ':4,'ㅗ':5,'ㅛ':6,'ㅜ':7,'ㅠ':8,'ㅡ':9,'ㅣ':1,'ㅐ':2,'ㅒ':3,'ㅔ':4,'ㅖ':5,'ㅘ':6,'ㅙ':7,'ㅚ':8,'ㅝ':9,'ㅞ':1,'ㅟ':2,'ㅢ':3};
const CHOS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNGS = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONGS = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function reduce(n, master=true) {
  if (master && (n===11||n===22||n===33)) return n;
  while (n > 9) {
    n = String(n).split('').reduce((s,d)=>s+Number(d), 0);
    if (master && (n===11||n===22||n===33)) return n;
  }
  return n;
}

function decomposeChar(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return {
    cho: CHOS[Math.floor(c/(21*28))],
    jung: JUNGS[Math.floor((c%(21*28))/28)],
    jong: JONGS[c%28] || ''
  };
}

function calcName(name) {
  const s = (name||'').replace(/\s/g,'');
  const hasHangul = /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(s);
  let cv=0, vv=0;

  // analysis.html과 동일: 한글이 하나라도 있으면 한글(및 자모)만 계산
  if (hasHangul) {
    for (const ch of s) {
      const d = decomposeChar(ch);
      if (d) {
        cv += HC[d.cho]||0;
        if (d.jong) for (const j of d.jong) cv += HC[j]||0;
        vv += HV[d.jung]||0;
        continue;
      }
      const cVal = HC[ch] || 0;
      const vVal = HV[ch] || 0;
      cv += cVal;
      vv += vVal;
    }
  } else {
    const clean = s.toUpperCase().replace(/[^A-Z]/g,'');
    for (const ch of clean) {
      const v = PY[ch]||0;
      if (VOWELS.has(ch)) vv += v; else cv += v;
    }
  }
  return {
    expression: reduce(cv+vv),
    soul: reduce(vv),
    personality: reduce(cv)
  };
}

function calcLifePath(dob) {
  if (!dob) return null;
  const [yy, mm, dd] = dob.split('-').map(Number);
  if (!yy || !mm || !dd) return null;

  // analysis.html과 동일한 규칙:
  // (연도 자리수합 축약) + (월 축약) + (일 축약) -> 최종 축약
  const yrSum = String(yy).split('').reduce((a, b) => a + Number(b), 0);
  const yr = reduce(yrSum);
  const mr = reduce(mm);
  const dr = reduce(dd);
  return reduce(yr + mr + dr);
}

function calcMaturity(expression, lp) {
  return lp ? reduce(expression + lp) : null;
}

/* ── Compatibility scoring (deterministic) ── */
const HIGH_PAIRS = new Set(['1-9','2-8','3-7','4-6','1-5','2-6','3-6','5-9','6-9','3-9','2-4','1-3','4-8']);
const LOW_PAIRS  = new Set(['1-4','1-8','4-5','5-8','4-7','7-8']);

function compat(a, b) {
  if (a === b) return 68;
  const k = [Math.min(a,b), Math.max(a,b)].join('-');
  if (HIGH_PAIRS.has(k)) return 82;
  if (LOW_PAIRS.has(k))  return 50;
  return 65;
}

function overallScore(A, B, lp1, lp2) {
  const ex   = compat(A.expression, B.expression);
  const soul = compat(A.soul, B.soul);
  const pers = compat(A.personality, B.personality);
  let sc = Math.round(ex*0.4 + soul*0.35 + pers*0.25);
  if (lp1 && lp2) sc = Math.round(sc*0.7 + compat(lp1,lp2)*0.3);
  return Math.min(99, Math.max(36, sc));
}

function directionalScore(from, to, fromLp, toLp) {
  const ex = compat(from.expression, to.expression);
  const emotionalPull = compat(from.soul, to.personality);
  const styleFit = compat(from.personality, to.soul);
  let sc = Math.round(ex*0.30 + emotionalPull*0.45 + styleFit*0.25);
  if (fromLp && toLp) sc = Math.round(sc*0.85 + compat(fromLp, toLp)*0.15);
  return Math.min(99, Math.max(36, sc));
}

function impressionViewScore(from, to, fromLp, toLp) {
  const firstImpact = compat(from.personality, to.personality);
  const attraction = compat(from.soul, to.expression);
  const comfort = compat(from.expression, to.personality);
  const sc = Math.round(firstImpact*0.35 + attraction*0.40 + comfort*0.25);
  return Math.min(99, Math.max(36, sc));
}

function scoreLevelClass(sc) {
  if (sc >= 80) return 'high';
  if (sc >= 65) return 'mid';
  return 'low';
}

function renderWhyChips(items) {
  return items.map((it)=>{
    const level = scoreLevelClass(it.score);
    const levelLabel = level === 'high' ? '높음' : level === 'mid' ? '보통' : '낮음';
    return `<span class="why-chip ${level}">${it.label} ${levelLabel}</span>`;
  }).join('');
}

function directionalWhy(from, to, fromLp, toLp) {
  const ex = compat(from.expression, to.expression);
  const emotionalPull = compat(from.soul, to.personality);
  const styleFit = compat(from.personality, to.soul);
  const items = [
    { label: '표현↔표현', score: ex },
    { label: '영혼→성격', score: emotionalPull },
    { label: '성격→영혼', score: styleFit }
  ];
  if (fromLp && toLp) items.push({ label: '인생수', score: compat(fromLp, toLp) });
  return items;
}

function impressionWhy(from, to) {
  const firstImpact = compat(from.personality, to.personality);
  const attraction = compat(from.soul, to.expression);
  const comfort = compat(from.expression, to.personality);
  return [
    { label: '성격↔성격', score: firstImpact },
    { label: '영혼→표현', score: attraction },
    { label: '표현→성격', score: comfort }
  ];
}

function scoreLabel(s) {
  if (s>=90) return {title:'천생연분',   cap:'운명이 엮어준 특별한 인연'};
  if (s>=80) return {title:'깊은 공명',  cap:'영혼의 주파수가 서로 닿는 관계'};
  if (s>=70) return {title:'자연스러운 조화', cap:'함께할수록 빛이 나는 사이'};
  if (s>=60) return {title:'성장하는 인연', cap:'서로를 통해 배우고 변화하는 관계'};
  if (s>=50) return {title:'도전적 인연', cap:'마찰 속에서 성숙을 찾는 관계'};
  return {title:'독립적 에너지', cap:'각자의 길에서 더 빛나는 두 사람'};
}

function harmonyData(n1, n2, name1, name2) {
  const t1 = tr(n1), t2 = tr(n2);
  const k = [Math.min(n1,n2),Math.max(n1,n2)].join('-');
  const pairDesc = HARMONY_PAIRS[k] ||
    `${name1}의 ${t1.name} 에너지와 ${name2}의 ${t2.name} 에너지는 서로를 자연스럽게 끌어당깁니다. ` +
    `두 사람 모두 ${[...t1.keys,...t2.keys].slice(0,2).join('과 ')}를 중요하게 여기는 공통점이 있으며, ` +
    `감정적 교류에서 서로의 결핍을 채워주는 상호보완적 관계가 될 가능성이 높습니다.`;

  const scEx   = compat(n1, n2);
  const scSoul = compat(tr(n1) ? n1 : 1, tr(n2) ? n2 : 1);

  const strengths = [];
  if (n1 === n2) strengths.push(`두 사람의 운명수가 동일(${n1})합니다 — 핵심 가치와 삶의 방향이 일치해 자연스럽게 깊은 신뢰가 쌓입니다`);
  strengths.push(`${name1}의 ${t1.keys[0]}과 ${name2}의 ${t2.keys[0]}이 서로를 강화시켜줍니다`);
  strengths.push(`감정 교류에서 상호보완적 균형이 자연스럽게 형성됩니다`);
  if (scEx >= 80) strengths.push(`운명수 조합(${n1}·${n2})이 수비학적으로 강한 공명 관계에 속합니다`);

  const tags = [...new Set([...t1.keys.slice(0,2),...t2.keys.slice(0,2)])];
  return { pairDesc, strengths, tags };
}

function growthData(n1, n2) {
  const sum = reduce(n1+n2);
  const t = tr(sum);
  const theme = GROWTH_THEMES[sum] || GROWTH_THEMES[reduce(sum,false)] || '';
  const practices = [
    `정기적으로 서로의 꿈과 가치관을 나누는 대화 시간을 만드세요`,
    `${t.keys[0]}과 ${t.keys[1]}을 함께 실천할 수 있는 공동의 프로젝트나 활동을 찾아보세요`,
    `서로 다른 강점이 충돌할 때 "틀림"이 아닌 "다름"으로 바라보는 연습을 하세요`,
    `힘든 순간에 도망치지 않고 솔직하게 대화하는 것 — 이 관계의 가장 큰 성장 포인트입니다`
  ];
  return { sum, t, theme, practices };
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const panel = document.getElementById('tab-'+id);
  panel.classList.add('active');
}

function animateNum(el, target, duration=1400) {
  let start = null, current = 0;
  function step(ts) {
    if (!start) start = ts;
    const progress = Math.min((ts - start) / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    current = Math.round(ease * target);
    el.textContent = current;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function matchBadge(score) {
  if (score >= 80) return ['match-high', '✦ 높은 공명'];
  if (score >= 65) return ['match-mid', '◈ 균형적 조화'];
  return ['match-low', '◇ 보완 관계'];
}

function renderNums(A, B, lp1, lp2, name1, name2) {
  const n1 = name1.length>5?name1.slice(0,5)+'…':name1;
  const n2 = name2.length>5?name2.slice(0,5)+'…':name2;
  const cards = [
    { label:'운명·표현수', sub:'말·재능·외적 역할', v1:A.expression, v2:B.expression },
    { label:'영혼수', sub:'내면의 욕구', v1:A.soul, v2:B.soul },
    { label:'성격수', sub:'외적 첫인상', v1:A.personality, v2:B.personality },
  ];
  if (lp1&&lp2) cards.push({ label:'인생수', sub:'생년월일 기반', v1:lp1, v2:lp2 });
  // 완성수는 운명·표현수 + 인생수이므로, 생년월일(인생수) 없이는 계산하지 않는다.
  if (lp1 && lp2) {
    const m1 = A.expression + lp1;
    const m2 = B.expression + lp2;
    cards.push({ label:'완성수', sub:'성숙기 잠재력', v1:reduce(m1), v2:reduce(m2) });
  }

  document.getElementById('numsGrid').innerHTML = cards.map(c=>{
    const sc = compat(c.v1, c.v2);
    const [cls, txt] = matchBadge(sc);
    const t1 = tr(c.v1), t2 = tr(c.v2);
    return `<div class="num-card">
      <div class="num-card-label">${c.label} <span class="num-card-sub">${c.sub}</span></div>
      <div class="num-pair-row">
        <div class="num-box">
          <div class="num-name">${n1}</div>
          <div class="num-val">${c.v1}</div>
          <div class="num-trait">${t1.name}</div>
        </div>
        <div class="num-sep">·</div>
        <div class="num-box">
          <div class="num-name">${n2}</div>
          <div class="num-val">${c.v2}</div>
          <div class="num-trait">${t2.name}</div>
        </div>
      </div>
      <div class="num-match-badge ${cls}">${txt}</div>
    </div>`;
  }).join('');
}

          <div class="a-block-text">${tr(persSum).name} — ${tr(persSum).keys.slice(0,2).join(', ')}<br><span style="font-size:12px;color:var(--ink-dim)">두 사람이 세상에 보이는 모습</span></div>
        </div>
      </div>

      <div class="tag-row">
        ${t.keys.map(k=>`<span class="tag tag-teal">${k}</span>`).join('')}
      </div>
    </div>`;
}

function renderImpression(A, B, name1, name2, lp1, lp2) {
  function buildCol(fromData, toData, fromName, toName, fromLp, toLp) {
    const fromN = fromData.personality;
    const toN = toData.personality;
    const i = imp(toN);
    const pc = impressionViewScore(fromData, toData, fromLp, toLp);
    const why = impressionWhy(fromData, toData);
    const pcColor = pc >= 80 ? 'var(--gold)' : pc >= 65 ? 'var(--teal)' : 'var(--rose)';
    return `<div class="imp-full-col">
      <div class="imp-full-title">
        <div class="imp-full-title-main">
          <span class="imp-from-name">${fromName}의 시선</span>
          <span class="imp-title-arrow">→</span>
          <span class="imp-to-name">${toName}</span>
        </div>
        <span class="imp-score" style="color:${pcColor};">${pc}점 <span class="imp-score-tag">첫인상 점수</span></span>
      </div>
      <div class="imp-score-why">${renderWhyChips(why)}</div>
      <div class="imp-subject-note">이 카드의 설명 대상은 <strong>${toName}</strong>입니다. 아래 약점·주의·트리거는 모두 <strong>${toName}</strong> 기준으로 읽어주세요.</div>

      <div class="imp-field">
        <div class="imp-field-label lbl-dim">${toName}의 첫인상 분위기</div>
        <div class="imp-field-text t-normal">${i.vibe} 분위기<span style="color:var(--gold-dim);font-size:11px;margin-left:6px;">${toN}번 · ${tr(toN).name}</span></div>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-gold">✦ 끌리는 이유</div>
        <div class="imp-field-text t-gold">${i.attract}</div>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-rose">${toName}에게서 주의할 점 · 거부감 요소</div>
        <div class="imp-field-text t-rose">${i.repel}</div>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-dim">${toName} 성향 요약</div>
        <div class="imp-field-text t-normal">${i.traits}</div>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-gold">${toName}의 장점 · 호감 포인트</div>
        <ul class="a-list" style="margin-top:4px;">
          ${i.strengths.map(s=>`<li><span class="li-icon" style="color:var(--gold)">✦</span><span style="font-size:13px;">${s}</span></li>`).join('')}
        </ul>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-rose">${toName}의 약점 · 주의할 점</div>
        <ul class="a-list" style="margin-top:4px;">
          ${i.weaknesses.map(w=>`<li><span class="li-icon" style="color:var(--rose)">◆</span><span style="font-size:13px;color:#d48080;">${w}</span></li>`).join('')}
        </ul>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-rose">${fromName}이 피해야 할 말 · ${toName}의 감정 트리거</div>
        <ul class="a-list" style="margin-top:4px;">
          ${i.taboos.map(t=>`<li><span class="li-icon" style="color:var(--rose);opacity:0.6">✕</span><span style="font-size:13px;color:rgba(232,226,216,0.6);">${t}</span></li>`).join('')}
        </ul>
      </div>

      <div class="imp-field">
        <div class="imp-field-label lbl-teal">장기적으로 매력적인 점</div>
        <div class="imp-field-text t-normal" style="color:rgba(90,176,168,0.85);">${i.longterm}</div>
      </div>

      <div class="imp-field" style="background:rgba(200,169,107,0.05);border-radius:10px;padding:12px 14px;margin-top:4px;">
        <div class="imp-field-label lbl-gold">${fromName}이 ${toName}에게 건네기 좋은 대화 시작 예시</div>
        <div class="imp-field-text t-dim">${i.starter}</div>
        <div style="margin-top:10px;">
          <div class="imp-field-label lbl-dim" style="margin-top:8px;">${fromName}이 ${toName}에게 잘 보이는 법</div>
          <div class="imp-field-text t-normal">${i.appeal}</div>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('tab-impression').innerHTML = `
    <div class="impression-grid">
      ${buildCol(A, B, name1, name2, lp1, lp2)}
      ${buildCol(B, A, name2, name1, lp2, lp1)}
    </div>`;
}

function renderSubScores(A, B, lp1, lp2) {
  const items = [
    { label:'감정 궁합', sc: compat(A.soul, B.soul), color:'var(--gold)' },
    { label:'성향 궁합', sc: compat(A.personality, B.personality), color:'var(--teal)' },
    { label:'방향 궁합', sc: compat(A.expression, B.expression), color:'var(--rose)' },
  ];
  if (lp1&&lp2) items.push({ label:'인생수 궁합', sc: compat(lp1,lp2), color:'var(--amber)' });

  document.getElementById('subScores').innerHTML = items.map(it=>`
    <div class="sub-score-item">
      <div class="sub-label">${it.label}</div>
      <div class="sub-score-bar">
        <div class="sub-score-fill" style="width:0%;background:${it.color};" data-w="${it.sc}%"></div>
      </div>
      <div class="sub-score-val">${it.sc}</div>
    </div>`).join('');

  setTimeout(()=>{
    document.querySelectorAll('.sub-score-fill').forEach(el=>{
      el.style.width = el.dataset.w;
    });
  }, 200);
}

function renderDirectionScores(name1, name2, score12, score21, why12, why21) {
  document.getElementById('directionScores').innerHTML = `
    <div class="direction-card">
      <div class="direction-label">${name1} → ${name2} (내가 보는 상대) · 종합 점수</div>
      <div class="direction-val">${score12}</div>
      <div class="direction-why">${renderWhyChips(why12)}</div>
    </div>
    <div class="direction-card">
      <div class="direction-label">${name2} → ${name1} (상대가 보는 나) · 종합 점수</div>
      <div class="direction-val">${score21}</div>
      <div class="direction-why">${renderWhyChips(why21)}</div>
    </div>
  `;
}

/* ── Main ── */
function runAnalysis() {
  const name1 = document.getElementById('name1').value.trim();
  const name2 = document.getElementById('name2').value.trim();
  const dob1  = document.getElementById('dob1').value;
  const dob2  = document.getElementById('dob2').value;
  const err   = document.getElementById('errMsg');

  if (!name1||!name2) { err.textContent='두 사람의 이름을 모두 입력해주세요'; return; }
  if (window.PaljaPlan && !PaljaPlan.checkBasicProductAccess('harmony', window.PALJA_USER_PLAN || 'free', err)) {
    return;
  }
  err.textContent='';

  const btn = document.getElementById('ctaBtn');
  btn.disabled = true;

  try {
    const A  = calcName(name1);
    const B  = calcName(name2);
    const lp1 = calcLifePath(dob1);
    const lp2 = calcLifePath(dob2);

    const score12 = directionalScore(A, B, lp1, lp2);
    const score21 = directionalScore(B, A, lp2, lp1);
    const why12 = directionalWhy(A, B, lp1, lp2);
    const why21 = directionalWhy(B, A, lp2, lp1);
    const score = Math.round((score12 + score21) / 2);
    const { title, cap } = scoreLabel(score);

    /* score ring */
    const circ = 2*Math.PI*76;
    const arc = document.getElementById('scoreArc');
    arc.style.strokeDasharray  = circ;
    arc.style.strokeDashoffset = circ;
    setTimeout(()=>{ arc.style.strokeDashoffset = circ*(1-score/100); }, 80);

    document.getElementById('scoreNames').innerHTML =
      `${name1}<span class="amp">&</span>${name2}`;
    animateNum(document.getElementById('scoreNum'), score);
    document.getElementById('scoreTitle').textContent   = title;
    document.getElementById('scoreCaption').textContent = cap;
    renderDirectionScores(name1, name2, score12, score21, why12, why21);

    renderSubScores(A, B, lp1, lp2);
    renderNums(A, B, lp1, lp2, name1, name2);
    renderHarmony(A, B, name1, name2);
    renderTension(A, B, name1, name2);
    renderGrowth(A, B, name1, name2);
    renderImpression(A, B, name1, name2, lp1, lp2);

    /* default to harmony tab */
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
    document.getElementById('tab-harmony').classList.add('active');

    const resultEl = document.getElementById('result');
    resultEl.style.display = 'block';
    resultEl.classList.remove('result-enter');
    void resultEl.offsetWidth;
    resultEl.classList.add('result-enter');

    setTimeout(()=>{
      resultEl.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 100);

  } catch(e) {
    err.textContent = '분석 오류: '+e.message;
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

function doReset() {
  document.getElementById('result').style.display = 'none';
  ['name1','name2'].forEach(id=>document.getElementById(id).value='');
  ['dob1','dob2'].forEach((id) => {
    if (window.PaljaBirthDatePicker?.clearInput) PaljaBirthDatePicker.clearInput(id);
    else document.getElementById(id).value = '';
  });
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter') runAnalysis(); });

(async function ensureAuthGate() {
  if (window.PaljaProductBootstrap) {
    await PaljaProductBootstrap.bootstrap({ product: 'harmony', requireLogin: true });
  }
  // 상담사 허브 등에서 URL 파라미터로 두 사람을 미리 채우고 자동 분석
  try {
    const qs = new URLSearchParams(location.search);
    const n1 = qs.get('n1'), n2 = qs.get('n2'), d1 = qs.get('d1'), d2 = qs.get('d2');
    const setVal = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
    setVal('name1', n1); setVal('name2', n2);
    setVal('dob1', d1); setVal('dob2', d2);
    if (qs.get('auto') === '1' && n1 && n2) {
      if (typeof runAnalysis === 'function') runAnalysis();
    }
  } catch (e) { /* ignore */ }
})();
</script>
