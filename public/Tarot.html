<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>타로 리딩 — 팔자연구소 8CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --cream:      #f5f0e8;
      --parchment:  #ede5d4;
      --sand:       #d4c4a8;
      --warm-brown: #8b6f47;
      --deep-brown: #4a3520;
      --ink:        #2c1f0e;
      --accent:     #c8a96e;
      --accent-lt:  #e8d5b0;
      --muted:      #9a8570;
      --border:     rgba(139,111,71,.15);
      --shadow:     rgba(44,31,14,.1);
      --teal:       #2e8b7a;
      --mystic:     #7b5ea7;
      --mystic-lt:  rgba(123,94,167,.08);

      --font-serif: 'Cormorant Garamond', 'Noto Serif KR', serif;
      --font-body:  'Noto Serif KR', serif;
      --font-mono:  'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      height: 56px;
      background: rgba(245,240,232,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 32px;
      position: sticky; top: 0; z-index: 100;
      justify-content: space-between;
    }
    .topbar-logo { font-family: var(--font-serif); font-size: 17px; font-weight: 500; color: var(--deep-brown); text-decoration: none; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-link { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .15s; }
    .topbar-link:hover { color: var(--deep-brown); }

    /* ── HERO ── */
    .hero {
      background: var(--deep-brown);
      padding: 64px 40px 56px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '✦';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 500px;
      color: rgba(200,169,110,.03);
      pointer-events: none;
      line-height: 1;
    }
    .hero-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
    .hero-title { font-family: var(--font-serif); font-size: 48px; font-weight: 300; color: var(--cream); line-height: 1.1; margin-bottom: 12px; }
    .hero-title em { font-style: italic; color: var(--accent); }
    .hero-desc { font-size: 13px; color: rgba(245,240,232,.5); line-height: 1.8; max-width: 440px; margin: 0 auto; }

    /* ── MAIN WRAP ── */
    .main { max-width: 860px; margin: 0 auto; padding: 48px 32px 80px; }

    /* ── STEP 1: 질문 ── */
    .step-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .step-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .step-title { font-family: var(--font-serif); font-size: 22px; font-weight: 400; color: var(--deep-brown); margin-bottom: 20px; }

    .question-input {
      width: 100%;
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ink);
      outline: none;
      resize: none;
      line-height: 1.7;
      transition: border-color .15s;
      min-height: 80px;
    }
    .question-input:focus { border-color: var(--accent); }
    .question-input::placeholder { color: var(--muted); }

    /* 배열 선택 */
    .spread-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }
    .spread-opt {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      background: var(--parchment);
    }
    .spread-opt:hover { border-color: var(--accent); background: var(--accent-lt); }
    .spread-opt.selected { border-color: var(--accent); background: var(--accent-lt); }
    .spread-opt-num { font-family: var(--font-serif); font-size: 28px; font-weight: 300; color: var(--accent); line-height: 1; margin-bottom: 4px; }
    .spread-opt-name { font-family: var(--font-mono); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .spread-opt-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }

    .shuffle-btn {
      width: 100%;
      margin-top: 20px;
      background: var(--deep-brown);
      color: var(--cream);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, transform .15s;
      letter-spacing: .02em;
    }
    .shuffle-btn:hover { background: var(--warm-brown); transform: translateY(-1px); }
    .shuffle-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── STEP 2: 카드 선택 ── */
    .deck-section { margin-bottom: 24px; }
    .deck-instruction {
      text-align: center;
      margin-bottom: 28px;
    }
    .deck-instruction p { font-size: 13.5px; color: var(--muted); line-height: 1.7; }
    .deck-instruction strong { color: var(--deep-brown); font-family: var(--font-serif); font-size: 16px; }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 6px;
      margin-bottom: 24px;
    }

    .deck-card {
      aspect-ratio: 2/3.2;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: transform .2s, box-shadow .2s;
      background: var(--deep-brown);
      border: 1px solid rgba(200,169,110,.2);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .deck-card::before {
      content: '✦';
      font-size: 14px;
      color: rgba(200,169,110,.3);
    }
    .deck-card:hover:not(.drawn) {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px var(--shadow);
      border-color: var(--accent);
    }
    .deck-card:hover:not(.drawn)::before { color: rgba(200,169,110,.7); }
    .deck-card.drawn {
      background: var(--accent-lt);
      border-color: var(--accent);
      cursor: default;
    }
    .deck-card.drawn::before { content: '✓'; color: var(--accent); font-size: 16px; }

    /* ── STEP 3: 뽑은 카드 ── */
    .drawn-cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
    }

    .tarot-card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 120px;
    }
    .tarot-card-pos {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .tarot-card {
      width: 100%;
      aspect-ratio: 2/3.2;
      border-radius: 10px;
      cursor: pointer;
      perspective: 800px;
      position: relative;
    }
    .tarot-card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.4,0,.2,1);
      border-radius: 10px;
    }
    .tarot-card.flipped .tarot-card-inner { transform: rotateY(180deg); }

    .tarot-card-back, .tarot-card-front {
      position: absolute; inset: 0;
      border-radius: 10px;
      backface-visibility: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px;
    }
    .tarot-card-back {
      background: var(--deep-brown);
      border: 1px solid rgba(200,169,110,.25);
    }
    .tarot-card-back::before {
      content: '✦';
      font-size: 28px;
      color: rgba(200,169,110,.3);
    }
    .tarot-card-back-hint {
      position: absolute;
      bottom: 8px;
      font-family: var(--font-mono);
      font-size: 7px;
      color: rgba(200,169,110,.3);
      letter-spacing: .1em;
    }
    .tarot-card-front {
      transform: rotateY(180deg);
      border: 1px solid var(--border);
      justify-content: flex-start;
      gap: 4px;
      padding: 6px;
    }
    .tarot-card-front.reversed { transform: rotateY(180deg) rotate(180deg); }

    .tarot-card-art {
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0,0,0,.04);
    }
    .tarot-card-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tarot-card-front-meta {
      flex-shrink: 0;
      width: 100%;
      text-align: center;
    }

    .card-symbol {
      font-size: 32px;
      margin-bottom: 6px;
      line-height: 1;
    }
    .card-name-ko {
      font-family: var(--font-serif);
      font-size: 10px;
      font-weight: 500;
      color: var(--deep-brown);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 3px;
    }
    .card-name-en {
      font-family: var(--font-mono);
      font-size: 7px;
      color: var(--muted);
      text-align: center;
      letter-spacing: .06em;
    }
    .card-reversed-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(192,57,43,.1);
      border: 1px solid rgba(192,57,43,.2);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 6px;
      color: #c0392b;
      padding: 2px 4px;
      letter-spacing: .06em;
    }

    .tarot-card-name {
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 500;
      color: var(--deep-brown);
      text-align: center;
      line-height: 1.4;
    }
    .tarot-card-reversed {
      font-family: var(--font-mono);
      font-size: 8px;
      color: #c0392b;
    }

    /* ── AI 리딩 ── */
    .reading-section {
      background: white;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 14px 14px 0;
      padding: 32px;
      margin-bottom: 24px;
    }
    .reading-tag {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .reading-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

    .reading-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 400;
      color: var(--deep-brown);
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .reading-text {
      font-size: 14px;
      line-height: 2;
      color: var(--ink);
      font-family: var(--font-serif);
      white-space: pre-wrap;
    }
    .reading-loading {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--muted);
      font-family: var(--font-mono);
    }
    .reading-spinner {
      width: 16px; height: 16px;
      border: 1.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 카드별 요약 */
    .card-summaries {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card-summary {
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .cs-pos { font-family: var(--font-mono); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .cs-name { font-family: var(--font-serif); font-size: 14px; font-weight: 500; color: var(--deep-brown); margin-bottom: 6px; }
    .cs-keywords { font-size: 11px; color: var(--teal); line-height: 1.6; }

    /* 다시하기 버튼 */
    .reset-btn {
      display: block;
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--deep-brown); background: var(--accent-lt); }

    /* ── GATE ── */
    .feature-gate {
      background: var(--parchment);
      border: 1px dashed var(--sand);
      border-radius: 10px;
      padding: 32px;
      text-align: center;
      margin-bottom: 24px;
    }
    .gate-icon { font-size: 28px; margin-bottom: 12px; }
    .gate-title { font-family: var(--font-serif); font-size: 18px; font-weight: 400; color: var(--deep-brown); margin-bottom: 8px; }
    .gate-desc { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }
    .gate-btn { display: inline-block; background: var(--deep-brown); color: var(--cream); padding: 10px 24px; border-radius: 6px; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; border: none; font-family: var(--font-body); transition: background .15s; }
    .gate-btn:hover { background: var(--warm-brown); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hero { padding: 40px 20px 36px; }
      .hero-title { font-size: 34px; }
      .main { padding: 28px 16px 60px; }
      .spread-options { grid-template-columns: 1fr 1fr 1fr; }
      .deck-grid { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
      .drawn-cards { gap: 10px; }
      .tarot-card-wrap { width: 90px; }
      .topbar { padding: 0 16px; }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a class="topbar-logo" href="index.html">팔자연구소</a>
  <div class="topbar-right">
    <a class="topbar-link" href="analysis.html">라이프코드</a>
    <a class="topbar-link" href="dashboard.html">대시보드</a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-tag">Tarot Reading · 타로 리딩</div>
  <h1 class="hero-title">카드가 전하는<br><em>오늘의 메시지</em></h1>
  <p class="hero-desc">78장의 타로 카드 속에서 지금 당신에게 필요한 이야기를 꺼냅니다.</p>
</section>

<!-- MAIN -->
<div class="main" id="mainArea">

  <!-- STEP 1: 질문 + 배열 선택 -->
  <div id="step1">
    <div class="step-card">
      <div class="step-label">Step 01</div>
      <div class="step-title">마음속 질문을 적어주세요</div>
      <textarea class="question-input" id="questionInput" placeholder="예) 지금 이 관계를 계속해야 할까요? / 새로운 시작을 해도 될까요? / 올해 커리어의 방향은?&#10;&#10;질문이 없다면 비워두세요. 오늘의 흐름을 읽어드립니다."></textarea>

      <div style="margin-top:24px;">
        <div class="step-label">배열 선택</div>
        <div class="step-title" style="font-size:16px;margin-bottom:16px;">몇 장으로 볼까요?</div>
        <div class="spread-options">
          <div class="spread-opt" onclick="selectSpread(3, this)">
            <div class="spread-opt-num">3</div>
            <div class="spread-opt-name">과거·현재·미래</div>
            <div class="spread-opt-desc">상황의 흐름을 간결하게</div>
          </div>
          <div class="spread-opt selected" onclick="selectSpread(5, this)">
            <div class="spread-opt-num">5</div>
            <div class="spread-opt-name">켈틱 크로스</div>
            <div class="spread-opt-desc">현재 상황의 깊은 통찰</div>
          </div>
          <div class="spread-opt" onclick="selectSpread(7, this)">
            <div class="spread-opt-num">7</div>
            <div class="spread-opt-name">호스슈 배열</div>
            <div class="spread-opt-desc">과거부터 결과까지 전체 흐름</div>
          </div>
        </div>
      </div>

      <button class="shuffle-btn" id="shuffleBtn" onclick="startShuffle()">
        ✦ 카드 셔플하기
      </button>
    </div>
  </div>

  <!-- STEP 2: 덱에서 카드 선택 -->
  <div id="step2" style="display:none;">
    <div class="step-card">
      <div class="step-label">Step 02</div>
      <div class="step-title">카드를 선택해주세요</div>
      <div class="deck-instruction">
        <p>눈을 감고 질문을 마음속에 떠올리세요.<br>
        직관이 이끄는 카드를 <strong id="drawCountText">5장</strong> 골라주세요.</p>
      </div>
      <div class="deck-grid" id="deckGrid"></div>
    </div>
  </div>

  <!-- STEP 3: 뽑은 카드 + 리딩 -->
  <div id="step3" style="display:none;">
    <div class="step-card" style="margin-bottom:24px;">
      <div class="step-label">Step 03</div>
      <div class="step-title">카드를 클릭해서 펼쳐보세요</div>
      <div class="drawn-cards" id="drawnCards"></div>
    </div>

    <div id="readingArea"></div>
    <div id="cardSummaries"></div>

    <button class="reset-btn" onclick="resetAll()">↺ 새로운 리딩 시작하기</button>
  </div>

</div>

<script>
let selectedSpread = 5;
let shuffledDeck = [];
let drawnCards = [];
let flippedCount = 0;

// ── 78장 타로 데이터 ──
const TAROT_DECK = [
  // 메이저 아르카나 (22장)
  { id:0,  name:"바보",         en:"The Fool",          symbol:"🌟", suit:"major", keywords:"새로운 시작, 순수함, 모험, 자유로운 영혼", upright:"새로운 여정의 시작. 두려움 없이 뛰어들 용기가 필요합니다.", reversed:"무모함, 준비 없는 시작, 위험 경시" },
  { id:1,  name:"마법사",       en:"The Magician",      symbol:"⚡", suit:"major", keywords:"의지력, 능력, 집중, 현실 구현", upright:"당신에게는 필요한 모든 도구가 있습니다. 실행에 옮길 때입니다.", reversed:"조작, 능력 낭비, 자기 의심" },
  { id:2,  name:"여교황",       en:"The High Priestess",symbol:"🌙", suit:"major", keywords:"직관, 내면의 지혜, 신비, 잠재의식", upright:"내면의 목소리에 귀 기울이세요. 답은 이미 내 안에 있습니다.", reversed:"억압된 직관, 비밀, 혼란" },

// 배열별 포지션 이름
const SPREAD_POSITIONS = {
  3: ["과거", "현재", "미래"],
  5: ["현재 상황", "장애물", "과거의 영향", "미래의 흐름", "최종 결과"],
  7: ["과거", "현재", "숨겨진 영향", "조언", "외부 영향", "희망/두려움", "최종 결과"]
};

// 배열별 배경색
const CARD_COLORS = {
  major: '#f5f0e8',
  wands: '#fef9f0',
  cups: '#f0f4fe',
  swords: '#f0faf8',
  pentacles: '#f5f5f0'
};

function escapeHtmlAttr(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;');
}

/** 저장소 `public/tarot/` 파일명: major (0~21).jpg, {suit} (1~14).jpg */
function getTarotCardImageSrc(card) {
  let file;
  if (card.suit === 'major') {
    file = `major (${card.id}).jpg`;
  } else {
    const base = { wands: 21, cups: 35, swords: 49, pentacles: 63 }[card.suit];
    if (base == null) return '';
    const rank = card.id - base;
    file = `${card.suit} (${rank}).jpg`;
  }
  return 'tarot/' + encodeURIComponent(file);
}

function selectSpread(n, el) {
  selectedSpread = n;
  document.querySelectorAll('.spread-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('drawCountText').textContent = n + '장';
}

function startShuffle() {
  const question = document.getElementById('questionInput').value.trim();
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('drawCountText').textContent = selectedSpread + '장';

  // 덱 셔플
  shuffledDeck = [...TAROT_DECK].sort(() => Math.random() - .5);
  drawnCards = [];

  // 덱 렌더링
  const grid = document.getElementById('deckGrid');
  grid.innerHTML = '';
  shuffledDeck.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'deck-card';
    el.dataset.index = i;
    el.onclick = () => drawCard(i, el);
    grid.appendChild(el);
  });
}

function drawCard(index, el) {
  if (el.classList.contains('drawn')) return;
  if (drawnCards.length >= selectedSpread) return;

  el.classList.add('drawn');
  const card = shuffledDeck[index];
  const isReversed = Math.random() < 0.3; // 30% 확률로 역방향
  drawnCards.push({ ...card, reversed: isReversed });

  if (drawnCards.length === selectedSpread) {
    setTimeout(showDrawnCards, 400);
  }
}

function showDrawnCards() {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'block';

  const positions = SPREAD_POSITIONS[selectedSpread];
  const container = document.getElementById('drawnCards');
  container.innerHTML = '';
  flippedCount = 0;

  drawnCards.forEach((card, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'tarot-card-wrap';

    const bgColor = CARD_COLORS[card.suit] || '#f5f0e8';

    const imgSrc = getTarotCardImageSrc(card);
    wrap.innerHTML = `
      <div class="tarot-card-pos">${positions[i]}</div>
      <div class="tarot-card" id="card-${i}" onclick="flipCard(${i})">
        <div class="tarot-card-inner">
          <div class="tarot-card-back">
            <div class="tarot-card-back-hint">클릭하여 공개</div>
          </div>
          <div class="tarot-card-front${card.reversed ? ' reversed' : ''}" style="background:${bgColor};">
            ${card.reversed ? '<div class="card-reversed-badge">역방향</div>' : ''}
            <div class="tarot-card-art"><img src="${imgSrc}" alt="${escapeHtmlAttr(card.name)}" loading="lazy" /></div>
            <div class="tarot-card-front-meta">
              <div class="card-name-ko">${card.name}</div>
              <div class="card-name-en">${card.en}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="tarot-card-name" id="cardname-${i}" style="opacity:0">${card.name}${card.reversed ? '<br><span class="tarot-card-reversed">역방향</span>' : ''}</div>
    `;
    container.appendChild(wrap);
  });
}

function flipCard(i) {
  const cardEl = document.getElementById('card-' + i);
  if (cardEl.classList.contains('flipped')) return;
  cardEl.classList.add('flipped');
  document.getElementById('cardname-' + i).style.opacity = '1';
  flippedCount++;

  if (flippedCount === selectedSpread) {
    setTimeout(startReading, 600);
  }
}

function startReading() {
  const question = document.getElementById('questionInput')?.value?.trim() || '';
  const positions = SPREAD_POSITIONS[selectedSpread];

  // 카드 요약
  const summaries = document.getElementById('cardSummaries');
  summaries.innerHTML = '<div class="card-summaries">' +
    drawnCards.map((card, i) => `
      <div class="card-summary">
        <div class="cs-pos">${positions[i]}</div>
        <div class="cs-name">${card.symbol} ${card.name}${card.reversed ? ' (역)' : ''}</div>
        <div class="cs-keywords">${card.reversed ? card.reversed : card.keywords}</div>
      </div>`).join('') + '</div>';

  const readingArea = document.getElementById('readingArea');
  const basicReading = drawnCards.map((card, i) =>
    `[${positions[i]}] ${card.name}${card.reversed ? ' (역방향)' : ''}\n${card.reversed ? card.reversed : card.upright}`
  ).join('\n\n');

  readingArea.innerHTML = `<div class="reading-section">
      <div class="reading-tag">✦ 카드 리딩</div>
      <div class="reading-title">${question ? `"${question}"` : '오늘의 흐름'}</div>
      <div class="reading-text">${basicReading}</div>
    </div>
    <div class="feature-gate">
      <div class="gate-icon">✨</div>
      <div class="gate-title">AI 종합 타로 리딩</div>
      <div class="gate-desc">지금은 카드에 담긴 문구로 리딩합니다. 카드 간 연결·질문 맞춤 종합 해석 AI는 서버 연동 후 제공할 예정이에요.<br><br><strong>Pro 플랜</strong> 안내는 <a href="pricing.html" style="color:var(--warm-brown);">요금 페이지</a>를 참고해 주세요.</div>
      <button class="gate-btn" onclick="location.href='pricing.html'">플랜 안내 →</button>
    </div>`;
}

function resetAll() {
  drawnCards = [];
  shuffledDeck = [];
  flippedCount = 0;
  document.getElementById('step1').style.display = 'block';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'none';
  document.getElementById('drawnCards').innerHTML = '';
  document.getElementById('readingArea').innerHTML = '';
  document.getElementById('cardSummaries').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

</script>
