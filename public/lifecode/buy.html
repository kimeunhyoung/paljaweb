<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#4a3520"/>
  <title>라이프코드 이용권 구매 — 건별 결제 | 팔자연구소 8CODE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/attribution.js"></script>
  <script src="/js/analytics.js?v=1" defer></script>
  <style>
    :root {
      --cream: #f5f0e8;
      --deep: #4a3520;
      --ink: #2c1f0e;
      --muted: #9a8570;
      --accent: #c8a96e;
      --teal: #2e8b7a;
      --border: rgba(74,53,32,.12);
      --font-body: 'Noto Serif KR', serif;
      --font-mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--ink);
      min-height: 100dvh;
      padding: 32px 20px 64px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .back {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.45rem; font-weight: 600; color: var(--deep); margin-bottom: 8px; }
    .lede { font-size: 0.88rem; color: var(--muted); line-height: 1.65; margin-bottom: 24px; }
    .product-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .product {
      display: block;
      width: 100%;
      text-align: left;
      padding: 18px 18px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      font-family: inherit;
      color: inherit;
    }
    .product:hover { border-color: var(--accent); }
    .product.is-selected {
      border-color: var(--teal);
      box-shadow: 0 0 0 1px var(--teal);
    }
    .product-name { font-size: 1rem; font-weight: 600; color: var(--deep); margin-bottom: 4px; }
    .product-price {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--deep);
      margin-bottom: 6px;
    }
    .product-price small { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
    .product-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.55; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .field input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--deep);
      color: var(--cream);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: .5; cursor: wait; }
    .msg {
      display: none;
      margin: 14px 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.55;
    }
    .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .msg.info { display: block; background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .success {
      display: none;
      margin-top: 24px;
      padding: 22px 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      border-left: 4px solid var(--teal);
    }
    .success.is-visible { display: block; }
    .success-kicker {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 10px;
    }
    .code-box {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      color: var(--deep);
      padding: 14px;
      background: var(--cream);
      border-radius: 10px;
      text-align: center;
      margin: 12px 0;
      user-select: all;
    }
    .success-note { font-size: 0.82rem; color: var(--muted); line-height: 1.65; margin-bottom: 14px; }
    .success-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .success-actions a, .success-actions button {
      flex: 1;
      min-width: 120px;
      text-align: center;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .link-primary { background: var(--deep); color: var(--cream); border: none; }
    .link-secondary { background: #fff; color: var(--deep); border: 1px solid var(--border); }
    .fine { margin-top: 20px; font-size: 0.72rem; color: var(--muted); line-height: 1.6; }
    .device-notice {
      margin-bottom: 20px;
      padding: 16px 16px 15px 44px;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 2px solid #ea580c;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 2px 8px rgba(234, 88, 12, .12);
    }
    .device-notice::before {
      content: '⚠';
      position: absolute;
      left: 14px;
      top: 16px;
      font-size: 1.15rem;
      line-height: 1;
    }
    .device-notice-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #9a3412;
      margin-bottom: 7px;
      letter-spacing: -0.01em;
    }
    .device-notice p {
      font-size: 0.84rem;
      color: #7c2d12;
      line-height: 1.65;
    }
    .device-notice strong { color: #c2410c; font-weight: 600; }
    .device-notice--pay {
      margin-top: 4px;
      margin-bottom: 14px;
      padding: 12px 14px 12px 40px;
      border-width: 1px;
      box-shadow: none;
    }
    .device-notice--pay::before { top: 12px; font-size: 1rem; }
    .device-notice--pay .device-notice-title { font-size: 0.88rem; margin-bottom: 4px; }
    .device-notice--pay p { font-size: 0.8rem; }
    .success-device {
      margin: 0 0 14px;
      padding: 12px 14px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #9a3412;
      line-height: 1.6;
    }
    .auth-gate {
      display: none;
      margin-bottom: 16px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .auth-gate.is-visible { display: block; }
    .auth-gate p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
    .auth-gate-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .auth-gate-actions a {
      flex: 1; min-width: 120px; text-align: center; padding: 11px 14px;
      border-radius: 10px; font-size: 0.85rem; text-decoration: none; font-weight: 600;
    }
    .auth-gate .link-primary { background: var(--deep); color: var(--cream); }
    .auth-gate .link-secondary { background: #fff; color: var(--deep); border: 1px solid var(--border); }
    .auth-ok {
      display: none;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--teal);
    }
    .auth-ok.is-visible { display: block; }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/pricing.html">← 요금제</a>
  <h1>라이프코드 건별 이용권</h1>
  <p class="lede">정기 구독 없이 <strong>한 번만</strong> 결제합니다. 자동 갱신은 없습니다.</p>

  <div class="device-notice" role="note">
    <div class="device-notice-title">기기 최대 4대</div>
    <p>같은 계정에서 휴대폰·PC 등 <strong>최대 4대</strong>까지 이용할 수 있습니다.</p>
  </div>

  <div id="shop">
    <div class="auth-gate" id="authGate">
      <p><strong>로그인이 필요합니다.</strong> 로그인 후 결제해 주세요.</p>
      <div class="auth-gate-actions">
        <a class="link-primary" id="authSignupLink" href="/signup.html">무료 가입하기</a>
        <a class="link-secondary" id="authLoginLink" href="/login.html">로그인</a>
      </div>
    </div>
    <p class="auth-ok" id="authOk">로그인됨 — 결제할 수 있습니다.</p>
    <div class="product-list" id="productList"></div>
    <div class="field">
      <label for="email">이메일 (선택 · 영수증·문의용)</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div id="msg" class="msg" role="alert"></div>
    <div class="device-notice device-notice--pay" role="note">
      <div class="device-notice-title">결제 후 바로 이용</div>
      <p>결제 완료와 동시에 이용권이 열립니다.</p>
    </div>
    <button type="button" class="btn" id="payBtn" disabled>결제하기</button>
    <p class="fine">카드 1회 결제입니다. 자동 갱신·빌링키 등록 없음.</p>
  </div>

  <div class="success" id="successPanel">
    <div class="success-kicker">결제 완료</div>
    <div class="success-device" role="note">
      <strong>결제가 완료되었습니다.</strong> 아래 버튼으로 바로 이용하세요. (기기 최대 4대)
    </div>
    <p class="success-note" id="expiresLine"></p>
    <div class="success-actions" id="successActions">
      <a class="link-primary" href="/lifecode/" id="successPrimary">이용 시작 →</a>
    </div>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const productList = document.getElementById('productList');
  const payBtn = document.getElementById('payBtn');
  const msgEl = document.getElementById('msg');
  const successPanel = document.getElementById('successPanel');
  const shop = document.getElementById('shop');
  const authGate = document.getElementById('authGate');
  const authOk = document.getElementById('authOk');
  let products = [];
  let selectedKey = 'basic30';
  let cfg = null;
  let sessionUser = null;

  function buyNextUrl() {
    return '/lifecode/buy.html?product=' + encodeURIComponent(selectedKey || 'counselor30');
  }

  function syncAuthLinks() {
    const next = encodeURIComponent(buyNextUrl().replace(/^\//, ''));
    const signup = document.getElementById('authSignupLink');
    const login = document.getElementById('authLoginLink');
    if (signup) signup.href = '/signup.html?next=' + next;
    if (login) login.href = '/login.html?next=' + next;
  }

  function updateAuthUi() {
    syncAuthLinks();
    if (sessionUser) {
      authGate.classList.remove('is-visible');
      authOk.classList.add('is-visible');
      const emailEl = document.getElementById('email');
      if (emailEl && !emailEl.value && sessionUser.email) emailEl.value = sessionUser.email;
      if (cfg && cfg.portoneConfigured && cfg.oneTimeEnabled !== false) payBtn.disabled = false;
    } else {
      authGate.classList.add('is-visible');
      authOk.classList.remove('is-visible');
      payBtn.disabled = true;
    }
  }

  function showMsg(text, kind) {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + (kind === 'err' ? 'err' : 'info');
    msgEl.style.display = 'block';
  }
  function clearMsg() {
    msgEl.style.display = 'none';
    msgEl.textContent = '';
  }

  function renderProducts() {
    productList.innerHTML = products.map((p) => {
      const sel = p.key === selectedKey ? ' is-selected' : '';
      const amt = new Intl.NumberFormat('ko-KR').format(p.amount);
      return `<button type="button" class="product${sel}" data-key="${p.key}">
        <div class="product-name">${p.title}</div>
        <div class="product-price">${amt}원 <small>/ ${p.days}일${p.aiCredits ? ` · AI ${p.aiCredits}크레딧` : ''} · 1회 결제</small></div>
        <div class="product-desc">${p.desc}</div>
      </button>`;
    }).join('');
    productList.querySelectorAll('.product').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedKey = btn.dataset.key;
        renderProducts();
        updateAuthUi();
      });
    });
  }

  async function authHeaders() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    return {
      Authorization: 'Bearer ' + session.access_token,
      'Content-Type': 'application/json',
    };
  }

  async function loadSession() {
    try {
      const { data: { session } } = await sb.auth.getSession();
      sessionUser = session?.user || null;
    } catch (_) {
      sessionUser = null;
    }
    updateAuthUi();
  }

  async function init() {
    try {
      const r = await fetch('/api/lifecode/checkout/config');
      cfg = await r.json();
      products = cfg.products || [];
      if (cfg.oneTimeEnabled === false) {
        renderProducts();
        showMsg('단건(1회) 구매는 현재 준비 중입니다. 지금은 월 구독으로 이용하실 수 있어요.', 'info');
        payBtn.disabled = true;
        return;
      }
      if (!cfg.portoneConfigured || !products.length) {
        showMsg('결제 준비 중입니다. 잠시 후 다시 시도해 주세요.', 'err');
        return;
      }
      if (!products.find((p) => p.key === selectedKey)) {
        selectedKey = products[0].key;
      }
      renderProducts();
      await loadSession();
    } catch (_) {
      showMsg('서버에 연결할 수 없습니다.', 'err');
    }
  }

  function showSuccess(result) {
    shop.style.display = 'none';
    successPanel.classList.add('is-visible');
    const exp = result.expiresAt ? new Date(result.expiresAt) : null;
    const expText = exp
      ? `${exp.getFullYear()}년 ${exp.getMonth() + 1}월 ${exp.getDate()}일까지`
      : null;
    let note = '이용권이 활성화되었습니다.';
    if (result.profileSkipped === 'has_subscription') {
      note = '결제는 완료됐지만, 이미 월 구독 중이라 건별 이용권 기간은 적용되지 않았습니다. 고객센터로 문의해 주세요.';
    } else if (result.profileSkipped === 'higher_plan') {
      note = '결제는 완료됐지만, 이미 Plus 이상 플랜을 이용 중이라 베이직 이용권은 적용되지 않았습니다. 고객센터로 문의해 주세요.';
    } else if (result.extended && expText) {
      note = `이용 기간이 연장되었습니다. ${expText}`;
    } else if (expText) {
      note = `이용 기한: ${expText}`;
    }
    document.getElementById('expiresLine').textContent = note;
    const primary = document.getElementById('successPrimary');
    const isCounselor = selectedKey === 'counselor30' || result.productTier === 'counselor' || result.counselorHub;
    if (primary) {
      primary.href = isCounselor ? '/counselor.html' : '/analysis.html';
      primary.textContent = isCounselor ? '상담사 허브 열기 →' : '분석 시작 →';
    }
    if (window.PaljaAnalytics?.track) {
      window.PaljaAnalytics.track('lifecode_purchase_success', { product: selectedKey });
    }
  }

  payBtn.addEventListener('click', async () => {
    clearMsg();
    if (!sessionUser) {
      showMsg('로그인 후 결제할 수 있어요.', 'info');
      updateAuthUi();
      return;
    }
    if (typeof PortOne === 'undefined') {
      showMsg('결제 모듈을 불러오지 못했습니다.', 'err');
      return;
    }
    payBtn.disabled = true;
    if (window.PaljaAnalytics?.track) {
      window.PaljaAnalytics.track('lifecode_checkout_start', { product: selectedKey });
    }
    try {
      const headers = await authHeaders();
      if (!headers) {
        showMsg('로그인이 만료됐어요. 다시 로그인해 주세요.', 'err');
        payBtn.disabled = false;
        return;
      }
      const email = document.getElementById('email').value.trim();
      const prep = await fetch('/api/lifecode/checkout/prepare', {
        method: 'POST',
        headers,
        body: JSON.stringify({ productKey: selectedKey, email: email || undefined }),
      });
      const prepJson = await prep.json().catch(() => ({}));
      if (!prep.ok) {
        if (prepJson.error === 'one_time_disabled') {
          showMsg('단건(1회) 구매는 현재 준비 중입니다. 지금은 월 구독으로 이용하실 수 있어요.', 'info');
          return;
        }
        if (prep.status === 401) {
          showMsg('로그인이 필요합니다.', 'info');
          updateAuthUi();
          return;
        }
        if (prep.status === 409) {
          showMsg(prepJson.message || prepJson.error || '지금은 이 이용권을 구매할 수 없습니다.', 'info');
          payBtn.disabled = false;
          return;
        }
        showMsg(prepJson.error || '결제 준비에 실패했습니다.', 'err');
        payBtn.disabled = false;
        return;
      }

      const response = await PortOne.requestPayment({
        storeId: cfg.storeId,
        channelKey: cfg.channelKey,
        paymentId: prepJson.paymentId,
        orderName: prepJson.orderName,
        totalAmount: prepJson.amount,
        currency: 'CURRENCY_KRW',
        payMethod: 'CARD',
        customer: email ? { email, fullName: '라이프코드 구매자' } : { fullName: '라이프코드 구매자' },
      });

      if (response && response.code != null) {
        showMsg(response.message || '결제가 취소되었습니다.', 'err');
        payBtn.disabled = false;
        return;
      }

      showMsg('결제 확인 중…', 'info');
      const conf = await fetch('/api/lifecode/checkout/confirm', {
        method: 'POST',
        headers: await authHeaders(),
        body: JSON.stringify({ paymentId: prepJson.paymentId }),
      });
      const confJson = await conf.json().catch(() => ({}));
      if (!conf.ok) {
        showMsg(confJson.error || '결제 확인에 실패했습니다. 문의해 주세요.', 'err');
        payBtn.disabled = false;
        return;
      }
      showSuccess(confJson);
    } catch (e) {
      console.error(e);
      showMsg('결제 중 오류가 발생했습니다.', 'err');
      payBtn.disabled = false;
    }
  });

  const params = new URLSearchParams(location.search);
  const qProduct = params.get('product');
  if (qProduct === 'basic30' || qProduct === 'counselor30') selectedKey = qProduct;

  init();
})();
</script>
</body>
</html>
