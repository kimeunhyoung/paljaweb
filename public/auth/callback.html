<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로그인 처리 중 — 팔자연구소</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: #faf9f7;
      color: #444;
    }
    .box { text-align: center; padding: 24px; }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid #e5e5e5;
      border-top-color: #8b6914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <p>로그인 처리 중입니다…</p>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1'

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'pkce' }
    })

    function readSafeNextUrl() {
      try {
        const raw = new URLSearchParams(window.location.search).get('next')
        if (!raw) return null
        const n = decodeURIComponent(raw).trim()
        if (!n || n.includes('..') || n.startsWith('//')) return null
        if (/^https?:/i.test(n)) return null
        if (!n.startsWith('/')) return '/' + n
        return n
      } catch {
        return null
      }
    }

    function goLogin(msg) {
      const q = msg ? '?error=' + encodeURIComponent(msg) : ''
      window.location.replace('/login.html' + q)
    }

    async function finishOAuth() {
      const params = new URLSearchParams(window.location.search)
      const oauthError = params.get('error_description') || params.get('error')
      if (oauthError) {
        goLogin(oauthError)
        return
      }

      const code = params.get('code')
      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code)
        if (error) {
          goLogin('소셜 로그인에 실패했습니다.')
          return
        }
      }

      const { data: { session } } = await supabase.auth.getSession()
      if (!session) {
        goLogin('로그인 세션을 확인할 수 없습니다.')
        return
      }

      const next = readSafeNextUrl()
      window.location.replace(next || '/dashboard.html')
    }

    finishOAuth()
  </script>
</body>
</html>
