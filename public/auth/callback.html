<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로그인 처리 중 — 팔자연구소</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: #faf9f7;
      color: #444;
    }
    .box { text-align: center; padding: 24px; }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid #e5e5e5;
      border-top-color: #8b6914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <p>로그인 처리 중입니다…</p>
  </div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1'

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        detectSessionInUrl: true,
        flowType: 'pkce',
        persistSession: true,
        autoRefreshToken: true
      }
    })

    function readSafeNextUrl() {
      try {
        const raw = new URLSearchParams(window.location.search).get('next')
        if (!raw) return null
        const n = decodeURIComponent(raw).trim()
        if (!n || n.includes('..') || n.startsWith('//')) return null
        if (/^https?:/i.test(n)) return null
        if (!n.startsWith('/')) return '/' + n
        return n
      } catch {
        return null
      }
    }

    function readOAuthError() {
      const search = new URLSearchParams(window.location.search)
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''))
      return (
        search.get('error_description') ||
        search.get('error') ||
        hash.get('error_description') ||
        hash.get('error')
      )
    }

    function goLogin(msg) {
      const q = msg ? '?error=' + encodeURIComponent(msg) : ''
      window.location.replace('/login.html' + q)
    }

    function waitForSession(timeoutMs = 6000) {
      return new Promise((resolve) => {
        let settled = false
        const done = (session) => {
          if (settled) return
          settled = true
          subscription.unsubscribe()
          clearTimeout(timer)
          resolve(session || null)
        }

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) done(session)
        })

        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED')) {
            done(session)
          }
        })

        const timer = setTimeout(async () => {
          const { data: { session } } = await supabase.auth.getSession()
          done(session)
        }, timeoutMs)
      })
    }

    async function finishOAuth() {
      const oauthError = readOAuthError()
      if (oauthError) {
        goLogin(decodeURIComponent(oauthError))
        return
      }

      // detectSessionInUrl 초기화 대기
      await new Promise((r) => setTimeout(r, 150))

      let session = await waitForSession(2500)
      const code = new URLSearchParams(window.location.search).get('code')

      if (!session && code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code)
        if (error) {
          goLogin(error.message || '소셜 로그인에 실패했습니다.')
          return
        }
        session = await waitForSession(3000)
      }

      if (!session) {
        goLogin('로그인 세션을 확인할 수 없습니다. 카카오는 Supabase에서 Allow users without an email을 켜보세요.')
        return
      }

      const next = readSafeNextUrl()
      window.location.replace(next || '/dashboard.html')
    }

    finishOAuth()
  </script>
</body>
</html>
