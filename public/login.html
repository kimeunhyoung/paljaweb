<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>로그인 — 팔자연구소 8CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" crossorigin>
  <link rel="stylesheet" href="css/site-topbar.css?v=8" />
  <link rel="stylesheet" href="css/site-header.css?v=8" />
  <link rel="stylesheet" href="css/style.css?v=20260610a">
  <script src="js/attribution.js"></script>
  <script src="js/analytics.js?v=1" defer></script>
  <script src="js/site-topbar.js?v=16" defer></script>
  <style>
    body { background: #f5f0e8; }
    .auth-main {
      padding: 40px 24px 64px;
      max-width: 720px;
      margin: 0 auto;
    }
    .auth-main h1 {
      font-family: var(--font-display);
      margin-bottom: 8px;
      color: var(--text);
    }
    .auth-main .auth-lead {
      color: var(--text2);
      margin-bottom: 24px;
    }
    .auth-form {
      display: grid;
      gap: 12px;
    }
    .auth-form label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
    }
    .auth-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
    }
    .auth-oauth {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }
    .auth-divider {
      text-align: center;
      margin: 18px 0;
      color: var(--text3);
    }
    .auth-footer {
      margin-top: 18px;
      color: var(--text2);
    }
    .auth-forgot {
      text-align: right;
      margin-top: -4px;
    }
    .auth-forgot a {
      font-size: 13px;
      color: var(--text3);
      text-decoration: underline;
    }
    #forgot-panel {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    #forgot-panel.open { display: block; }
  </style>
</head>
<body>
  <div
    class="site-top"
    data-topbar-variant="auth"
    data-topbar-title="로그인"
    data-auth-peer="signup.html"
    data-auth-peer-label="회원가입"
  ></div>

  <main class="auth-main">
    <h1>로그인</h1>
    <p class="auth-lead">이메일과 비밀번호로 로그인하세요.</p>

    <div id="auth-msg" style="margin-bottom:12px;"></div>

    <form id="login-form" class="auth-form">
      <label>
        이메일
        <input type="email" id="login-email" required />
      </label>
      <label>
        비밀번호
        <input type="password" id="login-password" required />
      </label>
      <p class="auth-forgot"><a href="#" id="forgot-toggle">비밀번호를 잊으셨나요?</a></p>
      <button type="submit" class="btn-fill" style="width:100%;">로그인</button>
    </form>

    <div id="forgot-panel">
      <p class="auth-lead" style="margin-bottom:12px;">가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
      <form id="forgot-form" class="auth-form">
        <label>
          이메일
          <input type="email" id="forgot-email" required />
        </label>
        <button type="submit" class="btn-cta" style="width:100%;">재설정 링크 보내기</button>
      </form>
    </div>

    <div id="resend-panel" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
      <p class="auth-lead" style="margin-bottom:12px;">인증 메일을 못 받으셨나요?</p>
      <form id="resend-verify-form" class="auth-form">
        <label>
          이메일
          <input type="email" id="resend-email" required />
        </label>
        <button type="submit" class="btn-cta" style="width:100%;">인증 메일 다시 보내기</button>
      </form>
    </div>

    <div class="auth-divider">또는</div>

    <div class="auth-oauth">
      <button id="google-login" data-provider="google" class="btn-cta" style="width:100%;">구글로 로그인</button>
      <button id="kakao-login" data-provider="kakao" class="btn-cta" style="width:100%;">카카오로 로그인</button>
      <button id="naver-login" data-provider="naver" class="btn-cta" style="width:100%;">네이버로 로그인</button>
    </div>

    <p class="auth-footer">계정이 없으신가요? <a id="inline-signup-link" href="signup.html">회원가입</a></p>
  </main>

  <script>
    (function () {
      var n = new URLSearchParams(location.search).get('next');
      if (!n) return;
      var q = 'next=' + encodeURIComponent(n);
      var i = document.getElementById('inline-signup-link');
      if (i) i.href = 'signup.html?' + q;
      var ft = document.getElementById('forgot-toggle');
      if (ft) {
        ft.addEventListener('click', function (e) {
          e.preventDefault();
          var panel = document.getElementById('forgot-panel');
          if (panel) panel.classList.toggle('open');
        });
      }
    })();
  </script>

  <script type="module" src="js/supabase-auth.js?v=20260807a"></script>
</body>
</html>
