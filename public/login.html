<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로그인 — 팔자연구소</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260507b">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="logo-mark">8</div>
        <span class="logo-text">팔자연구소</span>
      </a>
      <div class="nav-actions">
        <a id="nav-signup-link" href="signup.html" class="btn-nav-fill">회원가입</a>
      </div>
    </div>
  </nav>

  <main style="padding:120px 24px; max-width:720px; margin:0 auto;">
    <h1 style="font-family:var(--font-display); margin-bottom:8px;">로그인</h1>
    <p style="color:var(--text2); margin-bottom:24px;">이메일과 비밀번호로 로그인하세요.</p>

    <div id="auth-msg" style="margin-bottom:12px;"></div>

    <form id="login-form" style="display:grid; gap:12px;">
      <label>
        이메일
        <input type="email" id="login-email" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;" />
      </label>
      <label>
        비밀번호
        <input type="password" id="login-password" required style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;" />
      </label>
      <button type="submit" class="btn-fill" style="width:100%;">로그인</button>
    </form>

    <div style="text-align:center; margin:18px 0; color:var(--text3)">또는</div>

    <div style="display:flex; gap:12px; flex-direction:column;">
      <button id="google-login" data-provider="google" class="btn-cta" style="width:100%;">구글로 로그인</button>
      <button id="kakao-login" data-provider="kakao" class="btn-cta" style="width:100%;">카카오로 로그인</button>
      <button id="naver-login" data-provider="naver" class="btn-cta" style="width:100%;">네이버로 로그인</button>
    </div>

    <p style="margin-top:18px; color:var(--text2);">계정이 없으신가요? <a id="inline-signup-link" href="signup.html">회원가입</a></p>
  </main>

  <script>
    (function () {
      var n = new URLSearchParams(location.search).get('next');
      if (!n) return;
      var q = 'next=' + encodeURIComponent(n);
      var s = document.getElementById('nav-signup-link');
      var i = document.getElementById('inline-signup-link');
      if (s) s.href = 'signup.html?' + q;
      if (i) i.href = 'signup.html?' + q;
    })();
  </script>

  <script type="module" src="js/supabase-auth.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
