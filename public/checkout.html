<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>결제 — 팔자연구소 8CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+KR:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/plan-access.js"></script>
  <style>
    :root {
      --cream: #f5f0e8;
      --deep: #4a3520;
      --ink: #2c1f0e;
      --muted: #9a8570;
      --border: rgba(139,111,71,.18);
      --font-serif: 'Cormorant Garamond', 'Noto Serif KR', serif;
      --font-body: 'Noto Serif KR', serif;
      --font-mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--cream); color: var(--ink); min-height: 100vh; padding: 40px 20px 80px; }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-family: var(--font-serif); font-size: 26px; font-weight: 400; color: var(--deep); margin-bottom: 8px; }
    .sub { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
    .amount { font-family: var(--font-serif); font-size: 36px; color: var(--deep); margin-bottom: 24px; }
    .amount small { font-size: 14px; color: var(--muted); font-family: var(--font-body); }
    #payment-method, #agreement { display: none; }
    .btn {
      display: inline-block; width: 100%; text-align: center; padding: 14px 20px; border: none; border-radius: 8px;
      font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer;
      background: var(--deep); color: var(--cream); margin-top: 8px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.secondary { background: white; color: var(--deep); border: 1px solid var(--border); }
    .back { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 24px; }
    #msg { display: none; font-size: 13px; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; }
    #msg.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    #msg.info { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    #demo-box { display: none; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); }
    #demo-box p { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.65; }
  </style>
</head>
<body>
<div class="wrap">
  <a class="back" href="pricing.html">← 요금제</a>
  <h1 id="planTitle">플랜 결제</h1>
  <p class="sub" id="planDesc">결제가 완료되면 계정에 즉시 반영됩니다. 이용 기간이 끝나면 Free로 돌아갑니다.</p>
  <div class="amount" id="amountLine">—</div>
  <div id="msg"></div>
  <div id="pay-ui">
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <button type="button" class="btn" id="payBtn" disabled>결제하기</button>
  </div>
  <div id="demo-box">
    <p><strong>개발/스테이징</strong> 전용. 운영에서는 토스 실결제만 사용하세요.</p>
    <button type="button" class="btn secondary" id="demoBtn">데모: Professional 즉시 적용</button>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const PLAN_META = {
    basic: {
      title: 'Basic 플랜',
      desc: 'AI 종합 요약, 10년 타임라인, Growth Map 등 Basic 기능을 이용할 수 있어요.',
      orderName: 'Basic 플랜',
      prefix: 'pbas',
      successHref: 'analysis.html',
    },
    pro: {
      title: 'Pro 플랜',
      desc: 'PDF 저장, AI 오늘의 메시지, 로슈 격자 등 Pro 기능을 이용할 수 있어요.',
      orderName: 'Pro 플랜',
      prefix: 'pmid',
      successHref: 'dashboard.html',
    },
    professional: {
      title: 'Professional · 상담사 플랜',
      desc: '상담사 허브와 고객 관리, 다중 분석 기능을 이용할 수 있어요.',
      orderName: 'Professional 상담사 플랜',
      prefix: 'ppro',
      successHref: 'counselor.html',
    },
  };

  const PRICES = {
    basic: { monthly: 9900, annual: 7920 * 12 },
    pro: { monthly: 19900, annual: 15920 * 12 },
    professional: { monthly: 49900, annual: 39920 * 12 },
  };

  const params = new URLSearchParams(location.search);
  const plan = PLAN_META[params.get('plan')] ? params.get('plan') : 'professional';
  const cycle = params.get('cycle') === 'annual' ? 'annual' : 'monthly';
  const meta = PLAN_META[plan];
  const amount = PRICES[plan][cycle];

  document.getElementById('planTitle').textContent = meta.title;
  document.getElementById('planDesc').textContent = meta.desc + ' 이용 기간 만료 시 Free로 돌아갑니다.';
  document.title = meta.title + ' — 팔자연구소';

  function showMsg(text, kind) {
    const el = document.getElementById('msg');
    el.style.display = 'block';
    el.className = kind === 'err' ? 'err' : 'info';
    el.textContent = text;
  }

  document.getElementById('amountLine').innerHTML =
    new Intl.NumberFormat('ko-KR').format(amount) + '원 <small>' +
    (cycle === 'annual' ? '(연간 일시 납부)' : '(월간)') + '</small>';

  async function main() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search));
      return;
    }

    const { data: profile } = await sb.from('profiles').select('plan, plan_active_until').eq('id', session.user.id).single();
    const activePlan = window.PaljaPlan ? PaljaPlan.effectivePlan(profile) : (profile?.plan || 'free');
    const ranks = { free: 0, basic: 1, pro: 2, professional: 3 };
    if ((ranks[activePlan] || 0) >= (ranks[plan] || 0) && activePlan !== 'free') {
      showMsg('이미 ' + activePlan.charAt(0).toUpperCase() + activePlan.slice(1) + ' 이용 중입니다.', 'info');
      document.getElementById('pay-ui').innerHTML =
        '<a class="btn" href="' + meta.successHref + '" style="text-decoration:none;display:inline-block">계속 이용하기</a>';
      return;
    }

    let cfg = { storeId: '', channelKey: '', portoneConfigured: false, demoUpgrade: false };
    try {
      const r = await fetch('/api/checkout-config');
      if (r.ok) cfg = await r.json();
    } catch (_) {
      showMsg('결제 서버에 연결할 수 없습니다.', 'err');
      document.getElementById('payBtn').disabled = true;
      return;
    }

    if (cfg.demoUpgrade && plan === 'professional') {
      document.getElementById('demo-box').style.display = 'block';
      document.getElementById('demoBtn').onclick = async () => {
        const btn = document.getElementById('demoBtn');
        btn.disabled = true;
        try {
          const { data: { session: s2 } } = await sb.auth.getSession();
          const res = await fetch('/api/demo-upgrade-professional', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + s2.access_token },
          });
          if (!res.ok) {
            const j = await res.json().catch(() => ({}));
            showMsg(j.error || '적용 실패', 'err');
            btn.disabled = false;
            return;
          }
          window.location.href = 'counselor.html';
        } catch (e) {
          showMsg('요청 실패', 'err');
          btn.disabled = false;
        }
      };
    }

    if (!cfg.portoneConfigured || !cfg.storeId || !cfg.channelKey) {
      showMsg('PORTONE_STORE_ID, PORTONE_CHANNEL_KEY, PORTONE_API_SECRET 환경변수를 Render에 설정해 주세요.', 'err');
      document.getElementById('payBtn').disabled = true;
      return;
    }

    if (typeof PortOne === 'undefined') {
      showMsg('PortOne 결제 SDK를 불러오지 못했습니다.', 'err');
      document.getElementById('payBtn').disabled = true;
      return;
    }

    document.getElementById('payBtn').disabled = false;
    document.getElementById('payBtn').onclick = async () => {
      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      try {
        const { data: { session: s2 } } = await sb.auth.getSession();
        const prep = await fetch('/api/checkout/prepare', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + s2.access_token,
          },
          body: JSON.stringify({ plan, cycle }),
        });
        const prepJson = await prep.json().catch(() => ({}));
        if (!prep.ok) {
          showMsg(prepJson.error || '결제 준비에 실패했습니다.', 'err');
          btn.disabled = false;
          return;
        }
        const paymentId = prepJson.paymentId;
        const response = await PortOne.requestPayment({
          storeId: cfg.storeId,
          channelKey: cfg.channelKey,
          paymentId,
          orderName: meta.orderName,
          totalAmount: amount,
          currency: 'CURRENCY_KRW',
          payMethod: 'CARD',
          customer: {
            customerId: s2.user.id,
            fullName: s2.user.user_metadata?.full_name || s2.user.email || '회원',
            email: s2.user.email || undefined,
          },
        });
        if (response && response.code != null) {
          showMsg(response.message || '결제가 취소되었습니다.', 'err');
          btn.disabled = false;
          return;
        }
        window.location.href =
          window.location.origin +
          '/payment-success.html?paymentId=' + encodeURIComponent(paymentId) +
          '&plan=' + encodeURIComponent(plan);
      } catch (e) {
        showMsg(e?.message || '결제 창을 열 수 없습니다.', 'err');
        btn.disabled = false;
      }
    };
  }

  main();
})();
</script>
</body>
</html>
