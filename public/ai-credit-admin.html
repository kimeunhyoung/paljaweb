<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 월 크레딧 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: "Noto Serif KR", serif; background:#f5f0e8; color:#2c1f0e; margin:0; }
    .wrap { max-width:1100px; margin:0 auto; padding:24px; }
    h1 { margin:0 0 8px; font-size:28px; }
    .sub { margin:0 0 16px; color:#7d6b56; font-size:14px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    input, button { padding:8px 10px; border:1px solid #d7c8b3; border-radius:8px; font-size:14px; }
    button { background:#4a3520; color:#f5f0e8; cursor:pointer; }
    button.light { background:white; color:#2c1f0e; }
    table { width:100%; border-collapse:collapse; background:white; border:1px solid #e7dccd; }
    th, td { padding:10px; border-bottom:1px solid #f0e7dc; text-align:left; font-size:13px; vertical-align:middle; }
    th { background:#fbf7f1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .row-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .small { font-size:12px; color:#7d6b56; }
    .msg { margin:10px 0; padding:10px; border-radius:8px; display:none; }
    .msg.ok { background:#ecfdf3; color:#166534; border:1px solid #86efac; }
    .msg.err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .provider { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#f2e8d6; color:#4a3520; }
    .provider.google { background:#e8f0fe; color:#1a56c8; }
    .provider.kakao { background:#fef3c7; color:#854d0e; }
    .provider.naver { background:#dcfce7; color:#166534; }
    .provider.email { background:#f3f4f6; color:#374151; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 월 크레딧 관리자</h1>
    <p class="sub">사용자별 <strong>used(사용량)</strong>를 증감하고, <strong>가입 경로</strong>(이메일·구글·카카오·네이버)와 가입일을 확인할 수 있습니다.</p>
    <div class="toolbar">
      <label>기간(YYYY-MM) <input id="period" placeholder="2026-07" /></label>
      <label>검색(이메일/이름/경로) <input id="q" placeholder="user@example.com 또는 google" /></label>
      <button id="loadBtn" type="button">불러오기</button>
      <button id="logoutBtn" class="light" type="button">로그아웃</button>
    </div>
    <div id="msg" class="msg"></div>
    <div class="small" id="countLine"></div>
    <table>
      <thead>
        <tr>
          <th>이메일</th>
          <th>이름</th>
          <th>가입 경로</th>
          <th>가입일</th>
          <th>플랜</th>
          <th>한도</th>
          <th>used</th>
          <th>remaining</th>
          <th>조정</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    (function () {
      const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const periodEl = document.getElementById('period');
      const qEl = document.getElementById('q');
      const rowsEl = document.getElementById('rows');
      const msgEl = document.getElementById('msg');
      const countLine = document.getElementById('countLine');

      function currentPeriod() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return y + '-' + m;
      }
      periodEl.value = currentPeriod();

      function showMsg(text, ok) {
        msgEl.style.display = 'block';
        msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
        msgEl.textContent = text;
      }

      async function getToken() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session?.access_token) {
          location.href = 'login.html?next=' + encodeURIComponent('ai-credit-admin.html');
          throw new Error('로그인이 필요합니다.');
        }
        return session.access_token;
      }

      const PROVIDER_LABELS = {
        email: '이메일',
        google: '구글',
        kakao: '카카오',
        naver: '네이버',
      };

      function providerHtml(code) {
        const key = String(code || 'email').split(',')[0].trim().toLowerCase();
        const label = PROVIDER_LABELS[key] || code || '이메일';
        return `<span class="provider ${key}">${label}</span>`;
      }

      function formatJoinedAt(iso) {
        if (!iso) return '-';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return '-';
        return d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      }

      function rowHtml(u) {
        return `
          <tr data-id="${u.userId}" data-used="${u.used}" data-limit="${u.limit ?? 0}">
            <td class="mono">${u.email || '-'}</td>
            <td>${u.fullName || '-'}</td>
            <td>${providerHtml(u.signupProvider)}</td>
            <td class="small">${formatJoinedAt(u.joinedAt)}</td>
            <td>${u.plan || 'free'}</td>
            <td class="limit">${u.limit ?? 0}</td>
            <td class="used">${u.used}</td>
            <td class="remaining">${u.remaining ?? 0}</td>
            <td>
              <div class="row-actions">
                <button type="button" data-delta="-10">-10</button>
                <button type="button" data-delta="-1">-1</button>
                <button type="button" data-delta="1">+1</button>
                <button type="button" data-delta="10">+10</button>
                <input type="number" step="1" class="custom-delta" style="width:90px" placeholder="직접입력" />
                <button type="button" data-custom="1" class="light">적용</button>
              </div>
            </td>
          </tr>
        `;
      }

      async function loadUsers() {
        rowsEl.innerHTML = '<tr><td colspan="9">불러오는 중...</td></tr>';
        msgEl.style.display = 'none';
        try {
          const token = await getToken();
          const period = periodEl.value.trim() || currentPeriod();
          const q = qEl.value.trim();
          const res = await fetch('/api/admin/ai-credits/users?period=' + encodeURIComponent(period) + '&q=' + encodeURIComponent(q), {
            headers: { Authorization: 'Bearer ' + token },
          });
          const j = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(j.error || '목록 조회 실패');
          rowsEl.innerHTML = (j.users || []).map(rowHtml).join('') || '<tr><td colspan="9">사용자가 없습니다.</td></tr>';
          countLine.textContent = `기간 ${j.period} · ${j.count}명`;
        } catch (e) {
          rowsEl.innerHTML = '<tr><td colspan="9">불러오지 못했습니다.</td></tr>';
          showMsg(e.message || '오류가 발생했습니다.', false);
        }
      }

      async function adjust(row, delta) {
        const userId = row.getAttribute('data-id');
        if (!userId || !Number.isInteger(delta) || delta === 0) return;
        try {
          const token = await getToken();
          const period = periodEl.value.trim() || currentPeriod();
          const res = await fetch('/api/admin/ai-credits/adjust', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token,
            },
            body: JSON.stringify({ userId, period, delta }),
          });
          const j = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(j.error || '조정 실패');
          row.querySelector('.used').textContent = j.nextUsed;
          row.setAttribute('data-used', String(j.nextUsed));
          if (j.limit != null) {
            row.querySelector('.limit').textContent = j.limit;
            row.setAttribute('data-limit', String(j.limit));
          }
          const remaining = j.remaining != null
            ? j.remaining
            : Math.max(0, Number(row.getAttribute('data-limit') || 0) - j.nextUsed);
          row.querySelector('.remaining').textContent = remaining;
          showMsg(`조정 완료: ${userId} (used ${j.previousUsed} → ${j.nextUsed}, remaining ${remaining}, delta ${delta > 0 ? '+' : ''}${delta})`, true);
        } catch (e) {
          showMsg(e.message || '조정 실패', false);
        }
      }

      rowsEl.addEventListener('click', async (e) => {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        const row = target.closest('tr');
        if (!row) return;
        if (target.dataset.delta) {
          await adjust(row, Number(target.dataset.delta));
          return;
        }
        if (target.dataset.custom) {
          const input = row.querySelector('.custom-delta');
          const delta = Number(input && input.value);
          if (!Number.isInteger(delta) || delta === 0) {
            showMsg('직접 입력은 0이 아닌 정수만 가능합니다.', false);
            return;
          }
          await adjust(row, delta);
        }
      });

      document.getElementById('loadBtn').addEventListener('click', loadUsers);
      qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUsers(); });
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await sb.auth.signOut();
        location.href = 'login.html';
      });

      loadUsers();
    })();
  </script>
</body>
</html>
