  <style>
    :root {
      --cream: #f5f0e8;
      --parchment: #ede5d4;
      --warm-brown: #8b6f47;
      --deep-brown: #4a3520;
      --ink: #2c1f0e;
      --accent: #c8a96e;
      --accent-lt: #e8d5b0;
      --muted: #9a8570;
      --border: rgba(139,111,71,.15);
      --font-serif: 'Cormorant Garamond', 'Noto Serif KR', serif;
      --font-body: 'Noto Serif KR', serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--cream); }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 40px 24px 80px; }
    .brand { text-align: center; margin-bottom: 36px; }
    .brand-badge {
      display: inline-block; font-size: 11px; letter-spacing: .12em;
      color: var(--warm-brown); margin-bottom: 12px;
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 500; color: var(--deep-brown);
      margin-bottom: 8px;
    }
    .brand-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .brand-line {
      margin-top: 16px; font-size: 12px; color: var(--warm-brown);
      letter-spacing: .08em;
    }

    .input-panel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 24px;
    }
    .person-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .person-card .card-label {
      font-size: 11px; letter-spacing: .1em;
      color: var(--warm-brown); margin-bottom: 14px; font-weight: 600;
    }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block; font-size: 12px; color: var(--muted);
      margin-bottom: 6px; font-weight: 600;
    }
    .field input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 14px; background: var(--cream);
    }
    .field input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(200,169,110,.2);
    }
    .divider-col {
      display: flex; align-items: center; justify-content: center;
    }
    .divider-col .hex {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--parchment);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--deep-brown);
    }
    .cta-wrap { text-align: center; margin-bottom: 32px; }
    .error-text { color: #a04030; font-size: 13px; min-height: 20px; margin-bottom: 8px; }
    .cta-btn {
      font-family: inherit; font-size: 15px; font-weight: 600;
      padding: 14px 36px; border: none; border-radius: 999px;
      background: var(--deep-brown); color: var(--cream);
      cursor: pointer; letter-spacing: .04em;
      transition: background .15s, transform .1s;
    }
    .cta-btn:hover { background: #3a2a18; }
    .cta-btn:active { transform: scale(.98); }

    #p48Result[hidden] { display: none !important; }
    .score-section {
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      margin-bottom: 24px;
    }
    .score-names {
      font-size: 15px; color: var(--deep-brown);
      margin-bottom: 20px; font-weight: 600;
    }
    .score-names .amp { margin: 0 10px; color: var(--muted); font-weight: 400; }
    .score-ring-outer { position: relative; width: 180px; height: 180px; margin: 0 auto 16px; }
    .score-ring-outer svg { transform: rotate(-90deg); }
    .score-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .score-num {
      font-family: var(--font-serif);
      font-size: 48px; line-height: 1; color: var(--deep-brown);
    }
    .score-unit { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
    .score-title {
      font-size: 20px; font-weight: 600;
      color: var(--deep-brown); margin-bottom: 8px;
    }
    .score-caption {
      font-size: 15px;
      color: var(--deep-brown);
      line-height: 1.7;
      max-width: 36rem;
      margin: 0 auto;
      font-weight: 500;
    }
    .p48-person-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .p48-person-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
    }
    .p48-person-label { font-size: 11px; color: var(--warm-brown); margin-bottom: 4px; }
    .p48-person-name { font-size: 17px; font-weight: 600; color: var(--deep-brown); margin-bottom: 6px; }
    .p48-person-week { font-size: 13px; color: var(--ink); margin-bottom: 4px; }
    .p48-person-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .p48-trait-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .p48-trait-badge {
      font-size: 11px; padding: 4px 10px;
      border-radius: 20px; background: var(--parchment);
      color: var(--deep-brown); font-weight: 600;
    }
    .kw-chip {
      display: inline-block; font-size: 11px;
      padding: 3px 8px; margin: 2px 4px 2px 0;
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--warm-brown);
    }
    .p48-summary {
      font-size: 13px; color: var(--muted);
      line-height: 1.55; margin-top: 8px;
    }
    .p48-detail {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px 20px;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.65;
    }
    .p48-detail-headline {
      font-size: 16px;
      font-weight: 600;
      color: var(--deep-brown);
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
    }
    .p48-detail-headline strong {
      font-family: var(--font-serif);
      font-size: 1.15em;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .p48-detail-line { margin-bottom: 8px; }
    .p48-detail-foot {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .p48-detail-foot .p48-detail-line:last-child { margin-bottom: 0; }
    .p48-detail-meta {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 10px;
      line-height: 1.55;
    }
    .p48-rel-desc {
      margin: 0 0 4px;
      padding: 0;
      background: transparent;
      border: none;
      color: var(--ink);
    }
    .p48-rel-desc-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--warm-brown);
      margin-bottom: 14px;
    }
    .p48-rel-catchphrase {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--deep-brown);
      margin: 0 0 20px;
      padding: 14px 16px 14px 18px;
      background: var(--parchment);
      border-radius: 10px;
      border-left: 4px solid var(--accent);
      max-width: 40rem;
    }
    .p48-rel-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 40rem;
    }
    .p48-rel-field {
      margin: 0;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(245, 240, 232, 0.45);
      border: 1px solid rgba(139, 111, 71, 0.12);
    }
    .p48-rel-field-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--warm-brown);
      margin-bottom: 8px;
    }
    .p48-rel-field-text {
      font-size: 15px;
      line-height: 1.75;
      color: var(--ink);
      margin: 0;
    }
    .p48-rel-field--identity {
      background: #fff;
      border-color: var(--border);
    }
    .p48-rel-field--virtue {
      border-left: 3px solid #6d8f52;
    }
    .p48-rel-field--virtue .p48-rel-field-label { color: #4a6238; }
    .p48-rel-field--shadow {
      border-left: 3px solid #a67c5b;
    }
    .p48-rel-field--shadow .p48-rel-field-label { color: #7a4f38; }
    .p48-rel-field--action {
      background: rgba(200, 169, 110, 0.14);
      border: 1px solid rgba(200, 169, 110, 0.35);
      border-left: 3px solid var(--accent);
    }
    .p48-rel-field--action .p48-rel-field-label { color: var(--deep-brown); }
    .p48-rel-field--action .p48-rel-field-text {
      font-weight: 500;
      color: var(--deep-brown);
    }
    .p48-detail-hint {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }
    .p48-detail a { color: var(--warm-brown); font-weight: 600; }
    .reset-btn {
      display: block; width: 100%; max-width: 280px;
      margin: 24px auto 0; padding: 12px;
      font-family: inherit; font-size: 13px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); cursor: pointer;
    }
    .reset-btn:hover { border-color: var(--warm-brown); color: var(--deep-brown); }

    @media (max-width: 720px) {
      .topbar, .program-nav { padding-left: 16px; padding-right: 16px; }
      .input-panel { grid-template-columns: 1fr; }
      .divider-col .hex { margin: 4px auto; }
      .p48-person-grid { grid-template-columns: 1fr; }
      .p48-detail { padding: 18px 16px; }
      .p48-rel-catchphrase,
      .p48-rel-fields { max-width: none; }
      .p48-rel-field-text { font-size: 14px; }
    }
  </style>
  <link rel="stylesheet" href="css/site-topbar.css?v=5"/>
  <link rel="stylesheet" href="css/site-header.css?v=8"/>
</head>
<body>

<div class="site-top" data-topbar-title="48궁합" data-nav-current="p48" data-login-next="period48-compat.html"></div>

<div class="wrap">
  <header class="brand">
    <div class="brand-badge">팔자연구소 · 48주기 성격학</div>
    <h1 class="brand-title">48궁합</h1>
    <p class="brand-sub">두 사람의 48주간 성격 에너지로 보는 관계</p>
    <div class="brand-line">matrix4d · 관계 유형 20종</div>
  </header>

  <div class="input-panel">
    <div class="person-card">
      <div class="card-label">첫 번째 사람</div>
      <div class="field">
        <label for="p48Name1">이름</label>
        <input type="text" id="p48Name1" placeholder="이름 (선택)" autocomplete="name"/>
      </div>
      <div class="field birth-field-group birth-field-group--light">
        <label for="p48Dob1">생년월일</label>
        <input class="birth-date-native" type="date" id="p48Dob1" required/>
        <div class="birth-pick" id="p48Dob1PickRow" role="group" aria-label="생년월일" hidden>
          <button type="button" class="birth-pick-btn is-placeholder" id="p48Dob1YearBtn">연도</button>
          <button type="button" class="birth-pick-btn is-placeholder" id="p48Dob1MonthBtn">월</button>
          <button type="button" class="birth-pick-btn is-placeholder" id="p48Dob1DayBtn">일</button>
        </div>
      </div>
    </div>
    <div class="divider-col"><div class="hex" aria-hidden="true">48</div></div>
    <div class="person-card">
      <div class="card-label">두 번째 사람</div>
      <div class="field">
        <label for="p48Name2">이름</label>
        <input type="text" id="p48Name2" placeholder="이름 (선택)" autocomplete="name"/>
      </div>
      <div class="field birth-field-group birth-field-group--light">
        <label for="p48Dob2">생년월일</label>
        <input class="birth-date-native" type="date" id="p48Dob2" required/>
        <div class="birth-pick" id="p48Dob2PickRow" role="group" aria-label="생년월일" hidden>
          <button type="button" class="birth-pick-btn is-placeholder" id="p48Dob2YearBtn">연도</button>
          <button type="button" class="birth-pick-btn is-placeholder" id="p48Dob2MonthBtn">월</button>
          <button type="button" class="birth-pick-btn is-placeholder" id="p48Dob2DayBtn">일</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cta-wrap">
    <div class="error-text" id="p48Err"></div>
    <button type="button" class="cta-btn" onclick="runP48Compat()">궁합 보기</button>
  </div>

  <section id="p48Result" hidden>
    <div class="score-section">
      <div class="score-names" id="p48ScoreNames"></div>
      <div class="score-ring-outer">
        <svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
          <circle cx="90" cy="90" r="76" fill="none" stroke="rgba(139,111,71,.12)" stroke-width="8"/>
          <circle id="p48ScoreArc" cx="90" cy="90" r="76" fill="none"
            stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="478" stroke-dashoffset="478"
            style="transition: stroke-dashoffset 1.2s ease"/>
        </svg>
        <div class="score-center">
          <div class="score-num" id="p48ScoreNum">0</div>
          <div class="score-unit">관계유형</div>
        </div>
      </div>
      <div class="score-title" id="p48ScoreTitle"></div>
      <p class="score-caption" id="p48ScoreCaption"></p>
    </div>

    <div class="p48-person-grid" id="p48PersonGrid"></div>
    <div class="p48-detail" id="p48Detail"></div>
    <button type="button" class="reset-btn" onclick="resetP48Compat()">다시 입력하기</button>
  </section>
</div>

<div class="birth-picker-backdrop" id="birthPickerBackdrop" hidden aria-hidden="true">
  <div class="birth-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="birthPickerTitle">
    <div class="birth-picker-head" id="birthPickerTitle">연도 선택</div>
    <ul class="birth-picker-list" id="birthPickerList"></ul>
  </div>
</div>
<script src="js/birth-date-picker.js?v=20260610"></script>
<script>
PaljaBirthDatePicker.initAll([
  { inputId: 'p48Dob1', pickRowId: 'p48Dob1PickRow', yearBtnId: 'p48Dob1YearBtn', monthBtnId: 'p48Dob1MonthBtn', dayBtnId: 'p48Dob1DayBtn' },
  { inputId: 'p48Dob2', pickRowId: 'p48Dob2PickRow', yearBtnId: 'p48Dob2YearBtn', monthBtnId: 'p48Dob2MonthBtn', dayBtnId: 'p48Dob2DayBtn' },
]);
(async function () {
  if (window.PaljaProductBootstrap) {
    await PaljaProductBootstrap.bootstrap({ product: 'p48', requireLogin: true });
  }
  // 상담사 허브 등에서 URL 파라미터로 두 사람을 미리 채우고 자동 분석
  try {
    const qs = new URLSearchParams(location.search);
    const n1 = qs.get('n1'), n2 = qs.get('n2'), d1 = qs.get('d1'), d2 = qs.get('d2');
    const setVal = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
    setVal('p48Name1', n1); setVal('p48Name2', n2);
    setVal('p48Dob1', d1); setVal('p48Dob2', d2);
    if (qs.get('auto') === '1' && d1 && d2 && typeof runP48Compat === 'function') {
      runP48Compat();
    }
  } catch (e) { /* ignore */ }
})();
</script>
</body>
