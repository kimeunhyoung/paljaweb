<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>결제 완료 — 팔자연구소</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Noto Serif KR', serif; background: #f5f0e8; color: #2c1f0e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .box { max-width: 420px; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 12px; color: #4a3520; }
    p { font-size: 14px; color: #9a8570; line-height: 1.7; margin-bottom: 20px; }
    .spinner { width: 32px; height: 32px; border: 2px solid rgba(139,111,71,.2); border-top-color: #c8a96e; border-radius: 50%; animation: s .85s linear infinite; margin: 0 auto 20px; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { display: inline-block; background: #4a3520; color: #f5f0e8; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-size: 14px; }
    .err { color: #991b1b; font-size: 14px; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="loading"></div>
  <h1 id="title">결제 확인 중</h1>
  <p id="desc">잠시만 기다려주세요.</p>
  <p id="err" class="err" style="display:none"></p>
  <a href="dashboard.html" id="dash" style="display:none">마이페이지</a>
</div>
<script>
(function () {
  const SUPABASE_URL = 'https://sghsryumnrnftyjoqmwf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6S3W_oWrzG-Nv8wLK98gmg_q_KcB2I1';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const labels = { basic: 'Basic', plus: 'Plus', professional: 'Professional' };
  const hrefs = { basic: 'analysis.html', plus: 'dashboard.html', professional: 'counselor.html' };
  const descs = {
    basic: 'Basic 기능을 바로 이용해 보세요.',
    plus: 'Plus 기능을 바로 이용해 보세요.',
    professional: '상담사 허브에서 고객·일정을 관리하고 분석을 이어가세요.',
  };

  function showSuccess(plan) {
    document.getElementById('loading').style.display = 'none';
    const label = labels[plan] || plan;
    document.getElementById('title').textContent = label + ' 정기구독이 시작되었습니다';
    document.getElementById('desc').textContent =
      (descs[plan] || descs.professional) + ' 이용 기간마다 자동으로 갱신됩니다. 해지는 마이페이지에서 할 수 있어요.';
    const a = document.getElementById('dash');
    a.style.display = 'inline-block';
    a.href = hrefs[plan] || 'dashboard.html';
    a.textContent = plan === 'professional' ? '상담사 허브로 이동' : '시작하기';
  }

  async function run() {
    const q = new URLSearchParams(location.search);
    const paymentId = q.get('paymentId');
    const planParam = (q.get('plan') || '').toLowerCase();

    const fail = (msg) => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('title').textContent = '처리할 수 없습니다';
      document.getElementById('desc').style.display = 'none';
      const e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = msg;
      document.getElementById('dash').style.display = 'inline-block';
      document.getElementById('dash').href = 'pricing.html';
      document.getElementById('dash').textContent = '요금제로 돌아가기';
    };

    if (!paymentId) {
      fail('결제 정보가 없습니다. 요금제에서 다시 시도해주세요.');
      return;
    }

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      fail('로그인이 필요합니다. 같은 브라우저에서 로그인한 뒤 다시 결제해주세요.');
      return;
    }

    try {
      const res = await fetch('/api/portone/confirm', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + session.access_token,
        },
        body: JSON.stringify({ paymentId }),
      });
      const j = await res.json().catch(() => ({}));
      if (res.ok) {
        showSuccess((j.plan || planParam || 'basic').toLowerCase());
        return;
      }

      const stRes = await fetch('/api/subscription/status', {
        headers: { Authorization: 'Bearer ' + session.access_token },
      });
      if (stRes.ok) {
        const st = await stRes.json();
        const activePlan = (st.plan || 'free').toLowerCase();
        if (activePlan !== 'free' && (!planParam || activePlan === planParam)) {
          showSuccess(activePlan);
          return;
        }
      }

      fail(j.error || '결제 승인에 실패했습니다.');
    } catch (_) {
      fail('서버와 통신하지 못했습니다.');
    }
  }

  run();
})();
</script>
</body>
</html>
