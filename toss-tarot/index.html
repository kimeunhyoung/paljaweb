<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>팔자연구소 · 타로코드</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f0e8;
      }
      #tarot-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        box-sizing: border-box;
      }
      #toss-banner-host {
        display: none;
        flex-shrink: 0;
        width: 100%;
        min-height: 0;
        box-sizing: border-box;
        padding: 8px 16px 4px;
        background: #f5f0e8;
      }
      #toss-banner-host.is-active {
        display: block;
        min-height: 96px;
      }
      #tarot-frame {
        flex: 1;
        display: block;
        width: 100%;
        min-height: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="tarot-shell">
      <div id="toss-banner-host" aria-label="광고"></div>
      <iframe id="tarot-frame" title="팔자연구소 · 타로코드"></iframe>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
